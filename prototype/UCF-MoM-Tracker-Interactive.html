  return '<div class="row2">' +
      '<div class="field"><label>Meeting title<span class="req">*</span></label>' +
        '<input class="i" id="dTitle" data-bind="title" value="' + esc(dr.title) + '" placeholder="' + (dr.kind === 'instant' ? 'e.g. Trench collapse at Zone A — immediate review' : 'e.g. 5th Review Meeting — Project 1') + '"><div class="err" id="errTitle">A title is required</div></div>' +
      '<div class="field"><label>Category</label>' + sel('dCat', CATEGORIES, dr.cat, ' data-bind="cat"') + '</div>' +
    '</div>' +
    '<div class="row4">' +
      '<div class="field"><label>Date</label><input class="i" type="date" id="dDate" data-bind="date" value="' + esc(dr.date) + '"></div>' +
      '<div class="field"><label>Start</label><input class="i" type="time" id="dStart" data-bind="start" value="' + esc(dr.start) + '"></div>' +
      '<div class="field"><label>End</label><input class="i" type="time" id="dEnd" data-bind="end" value="' + esc(dr.end) + '"></div>' +
      '<div class="field"><label>Chairperson</label>' + sel('dChair', chairOpts, dr.chair, ' data-bind="chair"') + '</div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="field"><label>Venue</label><input class="i" id="dVenue" data-bind="venue" value="' + esc(dr.venue) + '"></div>' +
      '<div class="field"><label>Video conference link <span class="hint">(optional)</span></label>' +
        '<input class="i" id="dLink" data-bind="link" value="' + esc(dr.link) + '" placeholder="https://meet.example.gov/…"></div>' +
    '</div>' +
    '<div class="field" style="margin-bottom:0"><label>Projects covered<span class="req">*</span> <span class="hint">— invitees from these projects can add agenda points</span></label>' +
      '<div class="flex" style="gap:16px;margin-top:4px">' + pOpts.map(function (o) {
        var on = dr.prj.indexOf(o.v) >= 0;
        return '<span class="opt" data-act="toggle-prj" data-id="' + o.v + '"><span class="check' + (on ? ' on' : '') + '">' + (on ? TICK : '') + '</span>' + esc(o.l) + '</span>';
      }).join('') + '</div></div>';
}

function agendaEditor(dr, allowCarry) {
  var rows = dr.carried.map(function (id) {
    var it = item(id);
    return '<div class="flex" style="gap:10px;background:#FEFBF3;border:1px solid #EFD9AC;border-radius:9px;padding:9px 12px;font-size:12px">' +
      '<span class="aid">' + it.id + '</span><span style="flex:1;color:var(--navy)">' + esc(it.desc) + '</span>' +
      typePill(it.type) + statusChip(it.status) +
      '<span class="x" data-act="uncarry" data-id="' + id + '" style="cursor:pointer;color:var(--muted);font-weight:800">✕</span></div>';
  }).join('');

  var carryBlock = dr.carried.length
    ? '<div style="border:1px solid #EFD9AC;background:#FEFBF3;border-radius:10px;padding:12px 14px;margin-bottom:10px">' +
        '<div class="flex" style="gap:10px;margin-bottom:9px"><span style="width:24px;height:24px;border-radius:7px;background:#F5E3C0;color:#8A5F0B;display:grid;place-items:center;font-weight:800;font-size:11.5px">0</span>' +
        '<b style="font-size:13px;color:var(--navy)">Review of previous items</b>' +
        '<span class="muted" style="font-size:11.5px">carried forward · ' + dr.carried.length + ' item' + (dr.carried.length === 1 ? '' : 's') + '</span></div>' +
        '<div class="stack" style="gap:6px">' + rows + '</div></div>'
    : '';

  var pts = dr.agenda.map(function (a, i) {
    return '<div class="flex" style="gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff">' +
      '<span style="width:25px;height:25px;border-radius:7px;background:var(--ice);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:12px;flex:0 0 auto">' + (i + 1) + '</span>' +
      '<div style="flex:1;min-width:0"><b style="font-size:13px;color:var(--navy)">' + esc(a.t) + '</b>' +
      '<div class="muted" style="font-size:11.5px;margin-top:3px">' + (a.p ? ptag(a.p) : '<span class="ptag">All projects</span>') + ' &nbsp;added by ' + esc(u(a.by).name) + '</div></div>' +
      '<span class="x" data-act="del-agenda" data-i="' + i + '" style="cursor:pointer;color:var(--muted);font-weight:800">✕</span></div>';
  }).join('');

  return carryBlock + '<div class="stack" style="gap:9px">' + pts +
    '<div class="flex" style="gap:9px;align-items:flex-end">' +
      '<div class="field" style="flex:1;margin:0"><label>Add an agenda point</label>' +
        '<input class="i" id="agText" placeholder="Type the point to be discussed and press Add"></div>' +
      '<div class="field" style="width:190px;margin:0"><label>Project</label>' +
        sel('agPrj', [{ v: '', l: 'All projects / general' }].concat(dr.prj.map(function (p) { return { v: p, l: prj(p).name }; })), dr.prj[0] || '') + '</div>' +
      '<button class="btn dark" data-act="add-agenda">Add point</button>' +
      (allowCarry ? '<button class="btn ghost" data-act="carry-picker">Add from previous meetings</button>' : '') +
    '</div></div>';
}

function inviteeEditor(dr) {
  var chosen = dr.invitees.map(function (id) {
    var x = u(id);
    return '<span class="token">' + avatar(id, 20) + esc(x.name) + '<span class="muted" style="font-weight:400">· ' + esc(dg(x.dg).name) + '</span>' +
      (id === STATE.user.id ? '' : '<span class="x" data-act="toggle-invitee" data-id="' + id + '">✕</span>') + '</span>';
  }).join('');
  var pool = USERS.filter(function (x) {
    if (dr.invitees.indexOf(x.id) >= 0) return false;
    if (x.prj === 'ALL') return true;
    for (var i = 0; i < dr.prj.length; i++) if (x.prj.indexOf(dr.prj[i]) >= 0) return true;
    return false;
  });
  return '<div class="tokens" style="margin-bottom:12px">' + (chosen || '<span class="muted" style="font-size:12.5px">No invitees yet.</span>') + '</div>' +
    '<div class="section-label" style="margin-top:0">Add from the officer master</div>' +
    '<div class="ms-list">' + (pool.length ? pool.map(function (x) {
      return '<div class="ms-row" data-act="toggle-invitee" data-id="' + x.id + '">' + avatar(x.id, 24) +
        '<div style="flex:1"><b>' + esc(x.name) + '</b> <small>· ' + esc(dg(x.dg).name) + ' · ' + esc(x.dept) + '</small></div>' +
        (x.login ? '' : '<span class="tpill sched">No login</span>') + '<span class="lnk">Add</span></div>';
    }).join('') : '<div class="empty">Everyone in scope has been invited.</div>') + '</div>';
}

/* ---------------------------------------------------------------- instant */
function viewInstant() {
  var dr = STATE.draft;
  if (!dr || dr.kind !== 'instant') { return '<div class="empty">No instant meeting in progress. <button class="lnk" data-act="new-meeting">Start one</button></div>'; }

  if (dr.launched) {
    return '<div class="page-head"><div><div class="eyebrow">Instant meeting · live</div><h2>' + esc(dr.title || 'Untitled instant meeting') + '</h2>' +
      '<p>Launched at ' + esc(dr.start) + '. Everyone has been notified on email, WhatsApp and in-app at the same moment.</p></div>' +
      '<div class="actions"><button class="btn ghost" data-act="go" data-to="meetings">Back to meetings</button>' +
      '<button class="btn dark" data-act="instant-end">End meeting &amp; record minutes</button></div></div>' +
      '<div class="notice red"><span class="dot"></span><span><b>This meeting is live.</b> Its agenda was not circulated in advance — that is the trade-off of an instant meeting, and it is recorded as such on the MoM.</span></div>' +
      '<div class="cols c-32">' +
        '<div class="card"><div class="hd"><h3>Notification log</h3><span class="tag">sent ' + dr.invitees.length + ' × 3 channels</span></div>' +
        '<table><thead><tr><th>Invitee</th><th style="width:150px">Channel</th><th style="width:120px">Sent</th><th style="width:120px">State</th></tr></thead><tbody>' +
        dr.invitees.map(function (id) {
          var x = u(id);
          return '<tr><td class="strong">' + esc(x.name) + '</td><td>' + (x.login ? 'Email + WhatsApp + in-app' : 'Email + WhatsApp') + '</td>' +
            '<td class="muted nowrap">' + esc(dr.start) + '</td><td><span class="chip s-done">Delivered</span></td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="card"><div class="hd"><h3>Agenda as launched</h3></div><div class="bd stack" style="gap:8px">' +
        (dr.agenda.length ? dr.agenda.map(function (a, i) {
          return '<div class="flex" style="gap:10px;font-size:12.5px"><span class="aid">' + (i + 1) + '</span><span style="flex:1;color:var(--navy)">' + esc(a.t) + '</span></div>';
        }).join('') : '<span class="muted">Launched with no written agenda — points will be captured in the minutes.</span>') +
        '</div></div>' +
      '</div>' +
      guide('What an instant meeting gives up', [
        'No circulation window, so no invitee contributions and no RSVP. In exchange it can be running within minutes of a phone call.',
        'Everything after this point is identical to a scheduled meeting: attendance, minutes, actions and clarifications, MoM, signature, circulation.'
      ]);
  }

  return '<div class="page-head"><div><div class="eyebrow">Instant meeting</div><h2>Set up and launch</h2>' +
      '<p>One page, one person. Fill in what you know, add whatever agenda points you have, pick who is needed, and launch — notifications go out the moment you do.</p></div>' +
      '<div class="actions"><button class="btn ghost" data-act="go" data-to="meetings">Cancel</button>' +
      '<button class="btn primary" data-act="instant-launch">⚡ Launch &amp; notify now</button></div></div>' +
    '<div class="notice amber"><span class="dot"></span><span>An instant meeting has <b>no approval gate and no circulation window</b>. It is stamped “Instant” in the register and on the MoM so anyone reading it later knows the agenda was not seen in advance.</span></div>' +
    '<div class="cols c-32"><div class="stack" style="gap:16px">' +
      '<div class="card"><div class="hd"><h3>1 · Meeting details</h3><span class="tag">code is issued on launch</span></div>' +
        '<div class="bd">' + detailFields(dr) + '</div></div>' +
      '<div class="card"><div class="hd"><h3>2 · Agenda points</h3><span class="tag">optional — points can also be captured live</span></div>' +
        '<div class="bd">' + agendaEditor(dr, false) + '</div></div>' +
    '</div>' +
    '<div class="stack" style="gap:16px">' +
      '<div class="card"><div class="hd"><h3>3 · Invitees</h3><span class="tag">' + dr.invitees.length + '</span></div>' +
        '<div class="bd">' + inviteeEditor(dr) + '</div></div>' +
      '<div class="card"><div class="hd"><h3>On launch</h3></div><div class="bd">' +
        '<div class="stack" style="gap:9px">' +
        [['Meeting code issued', 'UCF/' + (dr.prj[0] || 'HO') + '/IM-nn'],
         ['Email sent', dr.invitees.length + ' recipients'],
         ['WhatsApp sent', dr.invitees.length + ' numbers'],
         ['In-app notice', dr.invitees.filter(function (i) { return u(i).login; }).length + ' users with a login'],
         ['Calendar entry', 'today, ' + esc(dr.start)]].map(function (r) {
          return '<div class="flex" style="justify-content:space-between;font-size:12.5px;border-bottom:1px solid var(--line);padding-bottom:7px">' +
            '<span class="muted">' + r[0] + '</span><b style="color:var(--navy)">' + esc(r[1]) + '</b></div>';
        }).join('') + '</div></div></div>' +
    '</div></div>';
}

/* ---------------------------------------------------------------- scheduled wizard */
var SCHED_STEPS = ['Plan the meeting', 'Draft the agenda', 'Add invitees', 'Invitee inputs & confirm'];

function viewSchedule() {
  var dr = STATE.draft;
  if (!dr || dr.kind !== 'scheduled') { return '<div class="empty">No scheduled meeting in progress. <button class="lnk" data-act="new-meeting">Start one</button></div>'; }

  var stepper = '<div class="stepper">' + SCHED_STEPS.map(function (s, i) {
    var n = i + 1, cls = n < dr.step ? 'done' : (n === dr.step ? 'now' : '');
    return '<div class="stp ' + cls + '" data-act="sched-step" data-n="' + n + '" style="cursor:pointer">' +
      '<span class="n">' + (n < dr.step ? '✓' : n) + '</span><div class="t">' + s + '</div></div>';
  }).join('') + '</div>';

  var body = '';
  if (dr.step === 1) {
    body = '<div class="cols c-32"><div class="card"><div class="hd"><h3>Step 1 · Plan the meeting</h3></div>' +
      '<div class="bd">' + detailFields(dr) + '</div></div>' +
      '<div class="card"><div class="hd"><h3>What happens next</h3></div><div class="bd"><div class="tl">' +
        [['Draft the agenda and pull forward open items', 'You'],
         ['Add invitees', 'You'],
         ['Invitees add their own points until the freeze', 'Invitees'],
         ['Confirm the meeting and notify everyone', 'You — Meeting Coordinator'],
         ['Attendance, minutes, actions and clarifications', 'after the meeting']].map(function (s, i) {
          return '<div class="e"><div class="rail"><div class="bub ' + (i === 0 ? 'now' : 'wait') + '">' + (i + 1) + '</div><div class="stem"></div></div>' +
            '<div class="body"><b>' + s[0] + '</b><div class="who">' + s[1] + '</div></div></div>';
        }).join('') + '</div>' +
        '<div class="notice" style="margin:14px 0 0"><span class="dot"></span><span>Confirmation sits with the <b>Meeting Coordinator</b>, not the Mission Director — as agreed for this build.</span></div>' +
      '</div></div></div>';
  } else if (dr.step === 2) {
    body = '<div class="card"><div class="hd"><h3>Step 2 · Draft the agenda</h3>' +
      '<span class="tag">' + dr.agenda.length + ' point' + (dr.agenda.length === 1 ? '' : 's') + (dr.carried.length ? ' + ' + dr.carried.length + ' carried forward' : '') + '</span></div>' +
      '<div class="bd">' + agendaEditor(dr, true) + '</div></div>' +
      guide('Carry-forward', ['<b>Add from previous meetings</b> pulls in every open action and clarification for the projects this meeting covers. Ticked items become agenda item 0 and travel into the new MoM with their live status, so nothing quietly falls off the list.']);
  } else if (dr.step === 3) {
    body = '<div class="cols c-32">' +
      '<div class="card"><div class="hd"><h3>Step 3 · Invitees</h3><span class="tag">' + dr.invitees.length + '</span></div>' +
        '<div class="bd">' + inviteeEditor(dr) + '</div></div>' +
      '<div class="card"><div class="hd"><h3>Agenda freeze</h3></div><div class="bd">' +
        '<div class="field"><label>Invitees may add points until</label><input class="i" id="dFreeze" data-bind="freeze" value="' + esc(dr.freeze) + '"></div>' +
        '<div class="notice amber"><span class="dot"></span><span>After the freeze, invitees can read the agenda but not add to it. Without a cut-off the agenda never settles and the meeting cannot be confirmed.</span></div>' +
      '</div></div></div>';
  } else {
    var contribs = [
      ['u8', 'Status of the two pumps delivered last week', 'P1'],
      ['u5', 'Whether the revised drawdown schedule needs lender sign-off', 'P1']
    ].filter(function () { return true; });
    body = '<div class="cols c-32"><div class="stack" style="gap:16px">' +
      '<div class="card"><div class="hd"><h3>Step 4 · Invitee inputs</h3><span class="tag">freeze at ' + esc(dr.freeze) + '</span></div><div class="bd">' +
        '<div class="notice"><span class="dot"></span><span>The agenda has been circulated. Invitees can add points of their own until the freeze; you can remove anything that does not belong.</span></div>' +
        '<div class="section-label" style="margin-top:0">Added by invitees since circulation</div>' +
        '<div class="stack" style="gap:8px">' + contribs.map(function (c) {
          return '<div class="flex" style="gap:11px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff">' +
            avatar(c[0], 26) + '<div style="flex:1"><b style="font-size:12.5px;color:var(--navy)">' + esc(c[1]) + '</b>' +
            '<div class="muted" style="font-size:11px;margin-top:2px">' + ptag(c[2]) + ' added by ' + esc(u(c[0]).name) + '</div></div>' +
            '<button class="btn sm ghost">Keep</button><button class="btn sm danger">Remove</button></div>';
        }).join('') + '</div>' +
        '<div class="section-label">Full agenda as it stands</div>' +
        '<div class="stack" style="gap:7px">' +
          (dr.carried.length ? '<div class="flex" style="gap:10px;font-size:12.5px;background:#FEFBF3;border:1px solid #EFD9AC;border-radius:9px;padding:9px 12px"><span class="aid">0</span><span style="flex:1;color:var(--navy)">Review of previous items (' + dr.carried.length + ')</span></div>' : '') +
          dr.agenda.map(function (a, i) {
            return '<div class="flex" style="gap:10px;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:9px 12px"><span class="aid">' + (i + 1) + '</span><span style="flex:1;color:var(--navy)">' + esc(a.t) + '</span></div>';
          }).join('') +
          contribs.map(function (c, i) {
            return '<div class="flex" style="gap:10px;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:9px 12px"><span class="aid">' + (dr.agenda.length + i + 1) + '</span><span style="flex:1;color:var(--navy)">' + esc(c[1]) + '</span><span class="muted" style="font-size:11px">invitee</span></div>';
          }).join('') +
        '</div></div></div>' +
      '</div>' +
      '<div class="stack" style="gap:16px">' +
        '<div class="card"><div class="hd"><h3>Responses</h3><span class="tag">' + dr.invitees.length + ' invited</span></div><div class="bd">' +
          '<div class="bars">' + [['Accepted', Math.max(dr.invitees.length - 2, 1), '#1B8A57'], ['Tentative', 1, '#D9990B'], ['No response', 1, '#B9C6D6']].map(function (b) {
            return '<div class="bar"><span class="muted">' + b[0] + '</span><div class="track"><div class="fill" style="width:' + Math.round(b[1] * 100 / dr.invitees.length) + '%;background:' + b[2] + '"></div></div><b>' + b[1] + '</b></div>';
          }).join('') + '</div></div></div>' +
        '<div class="card" style="border-left:4px solid var(--accent)"><div class="hd"><h3>Confirm the meeting</h3><span class="tag">Meeting Coordinator</span></div><div class="bd">' +
          '<p class="muted" style="font-size:12.5px;margin:0 0 12px">Confirming closes the agenda, issues the meeting code and sends the final agenda, date and link to all ' + dr.invitees.length + ' invitees on email, WhatsApp and in-app.</p>' +
          '<button class="btn primary" style="width:100%;justify-content:center" data-act="sched-confirm"' + (can('confirm_meeting') ? '' : ' disabled title="Only a Meeting Coordinator or PDMC can confirm"') + '>✓ Confirm meeting &amp; notify everyone</button>' +
          (can('confirm_meeting') ? '' : '<div class="notice" style="margin:13px 0 0"><span class="dot"></span><span>Your designation cannot confirm meetings. Switch to <b>Officer D</b> (Meeting Coordinator) or <b>Officer C</b> (PDMC) in the top bar.</span></div>') +
        '</div></div>' +
      '</div></div>';
  }

  var navBtns = '<div class="flex" style="gap:9px;margin-top:18px">' +
    (dr.step > 1 ? '<button class="btn ghost" data-act="sched-step" data-n="' + (dr.step - 1) + '">‹ Back</button>' : '') +
    (dr.step < 4 ? '<button class="btn dark" data-act="sched-step" data-n="' + (dr.step + 1) + '">Continue to ' + SCHED_STEPS[dr.step].toLowerCase() + ' ›</button>' : '') +
    '<span class="muted" style="font-size:11.5px;margin-left:auto">Draft saved automatically</span></div>';

  return '<div class="page-head"><div><div class="eyebrow">Scheduled meeting · step ' + dr.step + ' of 4</div>' +
      '<h2>' + esc(dr.title || 'New scheduled meeting') + '</h2>' +
      '<p>' + esc(dr.cat) + ' · ' + fmt(dr.date) + ' · ' + esc(dr.start) + '–' + esc(dr.end) + '</p></div>' +
      '<div class="actions"><button class="btn ghost" data-act="go" data-to="meetings">Save &amp; exit</button></div></div>' +
    stepper + body + navBtns;
}

/* carry-forward picker */
function carryPicker() {
  var dr = STATE.draft;
  var pool = ITEMS.filter(function (it) {
    if (dr.prj.indexOf(it.p) < 0) return false;
    return it.type === 'action' ? it.status !== 'Completed' : it.status !== 'Closed';
  });
  openModal('<div class="m-hd"><h3>Carry forward open items</h3><button class="x" data-act="close-modal">×</button></div>' +
    '<div class="m-bd"><div class="m-note">Every open action and clarification for ' + dr.prj.map(function (p) { return prj(p).name; }).join(' and ') +
    '. Ticked items become <b>agenda item 0 — review of previous items</b> and appear in the new MoM with their live status.</div>' +
    (pool.length ? '<table><thead><tr><th style="width:34px"></th><th style="width:70px">Item</th><th>Description</th><th style="width:96px">Type</th><th style="width:130px">Status</th><th style="width:104px">Ageing</th></tr></thead><tbody>' +
      pool.map(function (it) {
        var on = dr.carried.indexOf(it.id) >= 0;
        return '<tr class="clickable" data-act="toggle-carry" data-id="' + it.id + '"><td><span class="check' + (on ? ' on' : '') + '">' + (on ? TICK : '') + '</span></td>' +
          '<td><span class="aid">' + it.id + '</span></td><td class="strong">' + esc(it.desc) + '</td>' +
          '<td>' + typePill(it.type) + '</td><td>' + statusChip(it.status) + '</td>' +
          '<td class="muted nowrap" style="font-size:11.5px">' + ageing(it) + '</td></tr>';
      }).join('') + '</tbody></table>'
      : '<div class="empty">Nothing open for these projects — the last cycle closed cleanly.</div>') +
    '</div><div class="m-ft"><button class="btn primary" data-act="close-modal">Done</button></div>', true);
}


/* ==================== Meeting detail — five working tabs ==================== */
var MTABS = [
  ['agenda', 'Agenda'], ['attend', 'Attendance'], ['items', 'Actions / Clarifications'],
  ['docs', 'Documents'], ['mom', 'Signed MoM']
];

function viewMeeting() {
  var m = mtg(STATE.mid);
  if (!m) return '<div class="empty">Meeting not found. <button class="lnk" data-act="go" data-to="meetings">Back to the list</button></div>';
  var its = meetingItems(m.id);
  var counts = {
    agenda: m.agenda.length,
    attend: Object.keys(m.attend || {}).length ? Object.keys(m.attend).length : m.invitees.length,
    items: its.length,
    docs: (m.docs || []).length + (m.signed ? 1 : 0),
    mom: m.momState === 'none' ? 0 : 1
  };

  var hero = '<div class="mhero">' +
    '<div class="code"><span class="tpill ' + (m.type === 'instant' ? 'instant">Instant' : 'sched">Scheduled') + '</span>' +
      '<span>' + mcodeText(m) + ' · created by ' + esc(u(m.by).name) + ' · ' + esc(m.cat) + '</span></div>' +
    '<h2>' + esc(m.title) + '</h2>' +
    '<div class="facts">' +
      '<div><span>Date</span><b>' + fmt(m.date) + '</b></div>' +
      '<div><span>Time</span><b>' + esc(m.start) + ' – ' + esc(m.end) + '</b></div>' +
      '<div><span>Venue</span><b>' + esc(m.venue) + '</b></div>' +
      '<div><span>Chair</span><b>' + esc(u(m.chair).name) + '</b></div>' +
      '<div><span>Projects</span><b>' + m.prj.map(function (p) { return prj(p).name; }).join(', ') + '</b></div>' +
      '<div><span>Stage</span><b>' + (m.momState === 'signed' ? 'Closed' : (m.stage >= 7 ? 'Minutes & actions' : m.stage >= 6 ? 'Attendance' : m.stage >= 5 ? 'Confirmed' : 'In preparation')) + '</b></div>' +
      '<div style="margin-left:auto;align-self:center"><span class="flex" style="gap:7px">' +
        shareBtn('meeting', m.id, 'Share meeting') +
        (m.momState === 'signed' || m.momState === 'draft' || m.momState === 'approved' ? shareBtn('mom', m.id, 'Share MoM') : '') +
      '</span></div>' +
    '</div></div>';

  var steps = m.type === 'instant'
    ? ['Composed', 'Launched', 'Attendance', 'Minutes & items', 'MoM', 'Signed']
    : ['Planned', 'Agenda', 'Invitees', 'Invitee inputs', 'Confirmed', 'Attendance', 'Minutes & items', 'MoM & signature'];
  var cur = m.type === 'instant'
    ? (m.momState === 'signed' ? 6 : m.stage >= 7 ? 4 : m.stage >= 6 ? 3 : 2)
    : (m.momState === 'signed' ? 8 : m.stage);
  var stepper = '<div class="stepper">' + steps.map(function (s, i) {
    var n = i + 1, cls = n < cur ? 'done' : (n === cur ? 'now' : '');
    return '<div class="stp ' + cls + '"><span class="n">' + (n < cur ? '✓' : n) + '</span><div class="t">' + s + '</div></div>';
  }).join('') + '</div>';

  var tabs = '<div class="tabs">' + MTABS.map(function (t) {
    return '<button class="t' + (STATE.mtab === t[0] ? ' on' : '') + '" data-act="mtab" data-tab="' + t[0] + '">' + t[1] +
      '<span class="cnt">' + counts[t[0]] + '</span></button>';
  }).join('') + '</div>';

  var body = { agenda: tabAgenda, attend: tabAttend, items: tabItems, docs: tabDocs, mom: tabMom }[STATE.mtab](m);

  return hero + stepper + tabs + body;
}

/* ---------------------------------------------------------------- agenda */
function tabAgenda(m) {
  var frozen = m.stage >= 5 || m.type === 'instant';
  var rows = m.agenda.map(function (a, i) {
    var carry = !!a.carry;
    return '<div style="border:1px solid ' + (carry ? '#EFD9AC' : 'var(--line)') + ';background:' + (carry ? '#FEFBF3' : '#fff') +
      ';border-radius:10px;padding:13px 15px"><div class="flex" style="gap:11px;align-items:flex-start">' +
      '<span style="width:25px;height:25px;border-radius:7px;background:' + (carry ? '#F5E3C0' : 'var(--ice)') + ';color:' + (carry ? '#8A5F0B' : 'var(--navy)') +
      ';display:grid;place-items:center;font-weight:800;font-size:12px;flex:0 0 auto">' + (carry ? '0' : i) + '</span>' +
      '<div style="flex:1;min-width:0"><b style="font-size:13.5px;color:var(--navy)">' + esc(a.t) + '</b>' +
      '<div class="muted" style="font-size:11.5px;margin-top:3px">' + (a.p ? ptag(a.p) : '<span class="ptag">All projects</span>') +
      ' &nbsp;added by ' + esc(a.by === 'system' ? 'the system' : u(a.by).name) +
      (a.att ? ' &nbsp;·&nbsp; ' + a.att + ' attachment' + (a.att === 1 ? '' : 's') : '') + '</div></div>' +
      (carry ? '<span class="chip plain m-appr">Carried forward</span>' : (frozen ? '' : '<button class="btn sm ghost">Edit</button>')) +
      '</div></div>';
  }).join('') || '<div class="empty">No agenda points recorded.</div>';

  var rsvpCard = '';
  if (m.rsvp) {
    var vals = { yes: 0, tentative: 0, no: 0, '': 0 };
    m.invitees.forEach(function (id) { vals[m.rsvp[id] || ''] = (vals[m.rsvp[id] || ''] || 0) + 1; });
    rsvpCard = '<div class="card"><div class="hd"><h3>Responses</h3><span class="tag">' + m.invitees.length + ' invited</span></div><div class="bd"><div class="bars">' +
      [['Accepted', vals.yes, '#1B8A57'], ['Tentative', vals.tentative, '#D9990B'], ['No response', vals[''], '#B9C6D6']].map(function (b) {
        return '<div class="bar"><span class="muted">' + b[0] + '</span><div class="track"><div class="fill" style="width:' +
          Math.round(b[1] * 100 / m.invitees.length) + '%;background:' + b[2] + '"></div></div><b>' + b[1] + '</b></div>';
      }).join('') + '</div>' +
      '<div class="notice amber" style="margin:14px 0 0"><span class="dot"></span><span>Agenda freezes <b>' + esc(m.freeze) + '</b>. After that invitees can read it but not add to it, and the coordinator can confirm.</span></div>' +
      (can('confirm_meeting') ? '<button class="btn primary" style="width:100%;justify-content:center;margin-top:12px" data-act="confirm-existing" data-id="' + m.id + '">✓ Confirm meeting &amp; notify</button>' : '') +
      '</div></div>';
  }

  return '<div class="cols c-32"><div class="card"><div class="hd"><h3>Agenda</h3>' +
      '<span class="tag">' + (frozen ? 'frozen — the meeting is confirmed' : 'open for invitee contributions until ' + esc(m.freeze || 'the freeze')) + '</span>' +
      '<span style="margin-left:12px" class="flex">' + shareBtn('agenda', m.id, 'Share agenda') +
      (frozen ? '' : '<button class="btn sm ghost">+ Add point</button>') + '</span></div>' +
      '<div class="bd"><div class="stack" style="gap:9px">' + rows + '</div>' +
      (m.type === 'instant' ? '<div class="notice red" style="margin:14px 0 0"><span class="dot"></span><span>This was an <b>instant meeting</b> — the agenda was not circulated in advance and invitees had no opportunity to add to it.</span></div>' : '') +
      '</div></div>' +
    '<div class="stack" style="gap:16px">' +
      '<div class="card"><div class="hd"><h3>Invitees</h3><span class="tag">' + m.invitees.length + '</span></div><div class="bd"><div class="att">' +
        m.invitees.map(function (id) {
          var x = u(id);
          return '<div class="r">' + avatar(id, 31) + '<span class="nm"><b>' + esc(x.name) + '</b><small>' + esc(dg(x.dg).name) + ' · ' + esc(x.dept) + '</small></span>' +
            (id === m.chair ? '<span class="st"><span class="chip plain s-open">Chair</span></span>' : (x.login ? '' : '<span class="st"><span class="chip plain m-draft">No login</span></span>')) + '</div>';
        }).join('') + '</div></div></div>' + rsvpCard +
    '</div></div>';
}

/* ---------------------------------------------------------------- attendance */
function tabAttend(m) {
  var editable = can('mark_attendance') && m.momState !== 'signed';
  var att = m.attend || {};
  var rows = m.invitees.map(function (id) {
    var x = u(id), v = att[id] || '';
    function b(code, label, cls) {
      return '<button class="' + (v === code ? 'on ' + cls : '') + '"' + (editable ? ' data-act="attend" data-id="' + id + '" data-v="' + code + '"' : ' disabled') + '>' + label + '</button>';
    }
    return '<div class="r">' + avatar(id, 31) +
      '<span class="nm"><b>' + esc(x.name) + '</b><small>' + esc(dg(x.dg).name) + ' · ' + esc(x.dept) + '</small></span>' +
      '<span class="st"><span class="seg">' + b('P', 'Present', 'p') + b('V', 'Virtual', 'v') + b('A', 'Absent', 'a') + '</span></span></div>';
  }).join('');

  var P = 0, V = 0, A = 0, N = 0;
  m.invitees.forEach(function (id) { var v = att[id]; if (v === 'P') P++; else if (v === 'V') V++; else if (v === 'A') A++; else N++; });
  var rate = m.invitees.length ? Math.round((P + V) * 100 / m.invitees.length) : 0;

  return '<div class="cols c-32">' +
    '<div class="card"><div class="hd"><h3>Attendance</h3><span class="tag">Present · Virtual · Absent</span>' +
      (editable ? '<button class="btn sm ghost" style="margin-left:12px" data-act="attend-all">Mark everyone present</button>' : '') + '</div>' +
      '<div class="bd"><div class="att">' + rows +
      '<div class="r" style="border-style:dashed;background:#F9FBFD">' +
        '<span class="av" style="width:31px;height:31px;border-radius:50%;background:#B9C6D6;color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px">+</span>' +
        '<span class="nm"><b>Walk-in attendee</b><small>Someone who attended without being invited</small></span>' +
        '<span class="st"><button class="lnk">+ Add to this meeting</button></span></div>' +
      '</div>' + (editable ? '<div class="notice" style="margin:14px 0 0"><span class="dot"></span><span>Attendance locks once the MoM is submitted for approval.</span></div>' : '') +
      '</div></div>' +
    '<div class="stack" style="gap:16px">' +
      '<div class="card"><div class="hd"><h3>Summary</h3></div><div class="bd">' +
        '<div class="kpis" style="grid-template-columns:1fr 1fr;margin:0;gap:11px">' +
          '<div class="kpi good"><div class="num">' + P + '</div><div class="lab">Present in person</div></div>' +
          '<div class="kpi"><div class="num">' + V + '</div><div class="lab">Attended virtually</div></div>' +
          '<div class="kpi hot"><div class="num">' + A + '</div><div class="lab">Absent</div></div>' +
          '<div class="kpi warn"><div class="num">' + rate + '%</div><div class="lab">Attendance rate</div></div>' +
        '</div>' +
        (N ? '<div class="notice amber" style="margin:14px 0 0"><span class="dot"></span><span><b>' + N + ' not yet marked.</b> The MoM cannot be generated until every invitee is accounted for.</span></div>' : '') +
        ((att[m.chair] === 'P' || att[m.chair] === 'V')
          ? '<div class="notice green" style="margin:12px 0 0"><span class="dot"></span><span><b>Chair present.</b> Minutes can be recorded and a MoM issued.</span></div>'
          : '<div class="notice red" style="margin:12px 0 0"><span class="dot"></span><span><b>Chair not marked present.</b> A MoM issued without the chair has no standing.</span></div>') +
      '</div></div></div></div>';
}

/* ---------------------------------------------------------------- actions & clarifications */
function tabItems(m) {
  var its = meetingItems(m.id);
  var acts = its.filter(function (i) { return i.type === 'action'; });
  var clas = its.filter(function (i) { return i.type === 'clarification'; });
  var mayWrite = can('create_items') && m.momState !== 'signed';
  var mayMinute = can('record_minutes') && m.momState !== 'signed';

  var minutes = '<div class="card" style="margin-bottom:16px"><div class="hd"><h3>Minutes of the meeting</h3>' +
    '<span class="tag">' + (m.momState === 'signed' ? 'finalised' : 'draft · autosaved') + '</span></div><div class="bd">' +
    (mayMinute
      ? '<div class="rte-bar">' +
          '<button data-act="rte" data-cmd="bold"><b>B</b></button><button data-act="rte" data-cmd="italic"><i>I</i></button>' +
          '<button data-act="rte" data-cmd="underline"><u>U</u></button><span class="sep"></span>' +
          '<button data-act="rte" data-cmd="hiliteColor" data-val="#FFE9A8" style="background:#FFE9A8">H</button>' +
          '<button data-act="rte" data-cmd="hiliteColor" data-val="transparent">⌫H</button><span class="sep"></span>' +
          '<button data-act="rte" data-cmd="insertOrderedList">1.</button><button data-act="rte" data-cmd="insertUnorderedList">•</button><span class="sep"></span>' +
          '<button data-act="rte" data-cmd="formatBlock" data-val="H3">Heading</button><button data-act="rte" data-cmd="formatBlock" data-val="P">Normal</button>' +
          '<span class="sep"></span><button data-act="save-minutes">Save draft</button>' +
        '</div><div class="rte" id="rteBox" contenteditable="true">' + (m.minutes || '<p><i>Type or paste the minutes here…</i></p>') + '</div>'
      : '<div class="rte" style="border-radius:10px;min-height:auto">' + (m.minutes || '<p class="muted">No minutes recorded yet.</p>') + '</div>') +
    '</div></div>';

  function itemRow(it) {
    var isAct = it.type === 'action';
    var meta = '<div class="ameta"><span class="aid">' + it.id + '</span>' + typePill(it.type) + ptag(it.p) +
      (isAct ? priChip(it.pri) : '') +
      '<span>Raised by ' + esc(u(it.raised).name) + '</span>' +
      (isAct ? '<span>Due ' + fmt(it.due) + '</span><span class="muted">' + ageing(it) + '</span>'
             : '<span>Responded by ' + (it.respBy ? esc(u(it.respBy).name) : '<i>nobody yet</i>') + '</span>') +
      '</div>';
    var owners = isAct ? '<div class="ameta" style="margin-top:6px"><span>Responsible:</span>' + ownerStack(it.owners) + '</div>' : '';
    return '<div class="arow ' + (isAct ? 'act' : 'cla') + '"><div class="ah"><div class="atask">' +
      '<b>' + esc(it.desc) + '</b>' + meta + owners +
      (it.rem ? '<div class="rem"><b>Remarks</b>' + esc(it.rem) + '</div>' : '') +
      '<div class="abtns"><button class="btn sm ghost" data-act="open-item" data-id="' + it.id + '">Open</button>' +
      (mayWrite ? '<button class="btn sm ghost" data-act="edit-item" data-id="' + it.id + '">Edit</button>' : '') + '</div>' +
      '</div><div>' + statusChip(it.status) + '</div></div></div>';
  }

  return minutes +
    '<div class="card" style="margin-bottom:16px"><div class="hd"><h3>Actions</h3><span class="tag">' + acts.length + ' recorded</span>' +
      (mayWrite ? '<button class="btn sm primary" style="margin-left:12px" data-act="new-item" data-type="action">+ Add entry</button>' : '') + '</div>' +
      '<div class="bd">' + (acts.length ? acts.map(itemRow).join('') : '<div class="empty">No actions recorded from this meeting yet.</div>') + '</div></div>' +
    '<div class="card"><div class="hd"><h3>Clarifications</h3><span class="tag">' + clas.length + ' recorded · Open → Responded → Closed</span>' +
      (mayWrite ? '<button class="btn sm ghost" style="margin-left:12px" data-act="new-item" data-type="clarification">+ Add clarification</button>' : '') + '</div>' +
      '<div class="bd">' + (clas.length ? clas.map(itemRow).join('') : '<div class="empty">No clarifications recorded from this meeting yet.</div>') + '</div></div>' +
    guide('One form, two shapes', [
      '<b>+ Add entry</b> opens a single form with a type dropdown at the top. Choose <b>Action</b> and it asks for description, who raised it, the responsible officers, a due date, priority, status and remarks. Choose <b>Clarification</b> and it asks for description, who raised it, who responded, status and remarks — no due date, no owners.',
      'Responsible officers is a multi-select over the officer master, and <b>every selected officer is equally accountable</b>: the item appears on each of their dashboards, reminders go to all of them, and any of them can report it complete.'
    ]);
}

/* ---------------------------------------------------------------- documents */
function tabDocs(m) {
  var docs = (m.docs || []).slice();
  var mayAdd = can('manage_project_docs') || can('record_minutes');
  var rows = docs.length ? docs.map(function (dc) {
    return '<tr><td><span class="filerow" style="border:0;padding:0;background:none">' +
      '<span class="ic ' + (/\.xlsx?$/.test(dc.file) ? 'x' : (dc.type === 'Site photo' ? 'i' : '')) + '">' + (/\.xlsx?$/.test(dc.file) ? 'XLS' : 'PDF') + '</span>' +
      '<span><b style="font-size:12.5px;color:var(--navy);display:block">' + esc(dc.name) + '</b>' +
      '<small class="muted" style="font-size:11px">' + esc(dc.file) + ' · ' + esc(dc.size) + '</small></span></span></td>' +
      '<td><span class="ptag">' + esc(dc.type) + '</span></td><td>' + esc(dc.by) + '</td><td class="nowrap">' + fmt(dc.date) + '</td>' +
      '<td class="nowrap"><button class="lnk">View</button></td></tr>';
  }).join('') : emptyRow(5, 'No documents attached to this meeting.');

  return '<div class="cols c-32">' +
    '<div class="card"><div class="hd"><h3>Meeting documents</h3><span class="tag">' + docs.length + ' file' + (docs.length === 1 ? '' : 's') + '</span>' +
      '<span style="margin-left:12px" class="flex">' + shareBtn('meeting', m.id, 'Share documents') +
      (mayAdd ? '<button class="btn sm primary" data-act="add-doc" data-scope="meeting" data-id="' + m.id + '">+ Add document</button>' : '') + '</span></div>' +
      '<table><thead><tr><th>Document</th><th style="width:140px">Type</th><th style="width:110px">Added by</th><th style="width:104px">Date</th><th style="width:66px"></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="card"><div class="hd"><h3>What belongs here</h3></div><div class="bd">' +
      '<p class="muted" style="font-size:12.5px;margin:0 0 12px">Anything tabled at the meeting: progress notes, working sheets, photographs, correspondence. The <b>signed MoM lives on its own tab</b> so it can never be confused with a working paper.</p>' +
      '<div class="notice"><span class="dot"></span><span>Both a <b>document name</b> and a <b>file</b> are mandatory. A file uploaded without a name is the single most common reason a document repository becomes unusable a year later.</span></div>' +
    '</div></div></div>';
}

/* ---------------------------------------------------------------- signed MoM */
function tabMom(m) {
  var st = m.momState;
  var mayApprove = can('approve_mom'), mayUpload = can('upload_signed'), mayRecord = can('record_minutes');

  if (st === 'none') {
    return '<div class="card"><div class="hd"><h3>Minutes of Meeting</h3><span class="tag">not generated</span></div><div class="bd">' +
      '<div class="notice amber"><span class="dot"></span><span>No MoM has been generated for this meeting yet. It is built automatically from the attendance, minutes, actions and clarifications already recorded — nothing is retyped.</span></div>' +
      '<button class="btn primary" data-act="mom" data-to="draft"' + (mayRecord ? '' : ' disabled') + '>Generate the MoM</button></div></div>';
  }

  var paper = momPaper(m);

  var side = '';
  if (st === 'draft') {
    side = '<div class="card"><div class="hd"><h3>Submit for approval</h3></div><div class="bd">' +
      '<div class="stack" style="gap:9px">' +
      [['All agenda items minuted', true], ['Attendance recorded for every invitee', Object.keys(m.attend || {}).length === m.invitees.length],
       ['Every action has at least one responsible officer', true], ['Every action has a due date', true]].map(function (c) {
        return '<div class="flex" style="gap:9px;font-size:12.5px"><span style="width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:' +
          (c[1] ? 'var(--ok)' : '#EDF1F6') + ';color:' + (c[1] ? '#fff' : '#98A5B4') + ';font-size:10px;font-weight:800">' + (c[1] ? '✓' : '·') + '</span>' +
          '<span style="flex:1;color:' + (c[1] ? 'var(--ink)' : 'var(--muted)') + '">' + c[0] + '</span></div>';
      }).join('') + '</div>' +
      '<div class="notice amber" style="margin:14px 0"><span class="dot"></span><span>Submitting locks the minutes, attendance and items against editing and routes the MoM to the <b>Mission Director / Addl. MD</b>.</span></div>' +
      '<button class="btn primary" style="width:100%;justify-content:center" data-act="mom" data-to="submitted"' + (mayRecord ? '' : ' disabled') + '>Submit for approval</button></div></div>';
  } else if (st === 'submitted') {
    side = '<div class="card" style="border-left:4px solid var(--warn)"><div class="hd"><h3>Awaiting approval</h3><span class="tag">pending 4 days</span></div><div class="bd">' +
      '<div class="field"><label>Decision remark <span class="hint">(required to return or reject)</span></label><textarea class="i" placeholder="Type your remark…"></textarea></div>' +
      '<div class="flex" style="gap:9px">' +
      '<button class="btn good" data-act="mom" data-to="approved"' + (mayApprove ? '' : ' disabled') + '>✓ Approve</button>' +
      '<button class="btn ghost" data-act="mom" data-to="returned"' + (mayApprove ? '' : ' disabled') + '>↩ Return</button>' +
      '<button class="btn danger" data-act="mom" data-to="draft"' + (mayApprove ? '' : ' disabled') + '>✕ Reject</button></div>' +
      (mayApprove ? '' : '<div class="notice" style="margin:13px 0 0"><span class="dot"></span><span>Only the <b>Mission Director</b> or <b>Addl. Mission Director</b> can act here. Switch role in the top bar.</span></div>') +
      '</div></div>';
  } else if (st === 'returned') {
    side = '<div class="card" style="border-left:4px solid var(--danger)"><div class="hd"><h3>Returned for correction</h3></div><div class="bd">' +
      '<div class="notice red"><span class="dot"></span><span>Returned by the Mission Director. Fix the minutes or the items, then submit again — the version history keeps both copies.</span></div>' +
      '<button class="btn primary" data-act="mom" data-to="submitted">Re-submit</button></div></div>';
  } else if (st === 'approved') {
    side = '<div class="card" style="border-left:4px solid var(--ok)"><div class="hd"><h3>Approved — upload the signed copy</h3></div><div class="bd">' +
      '<div class="notice green"><span class="dot"></span><span>Approved. Print, obtain the chairperson’s signature, scan and upload. The system checks the scan against the approved draft before it will circulate.</span></div>' +
      '<div class="drop">' + ic('up', 26) + '<b>Upload the signed MoM</b><small>PDF only · up to 20 MB</small></div>' +
      '<button class="btn primary" style="width:100%;justify-content:center;margin-top:13px" data-act="mom" data-to="signed"' + (mayUpload ? '' : ' disabled') + '>Upload &amp; circulate</button></div></div>';
  } else {
    side = '<div class="stack" style="gap:16px">' +
      '<div class="card"><div class="hd"><h3>Signed copy</h3><span class="tag">' + fmt(m.signed.date) + '</span></div><div class="bd">' +
        '<div class="filerow" style="border-color:#BEE3CF;background:#F5FBF7"><span class="ic">PDF</span>' +
        '<div style="flex:1"><b style="font-size:12.5px;color:var(--navy);display:block">' + esc(m.signed.file) + '</b>' +
        '<small class="muted" style="font-size:11px">' + esc(m.signed.size) + ' · ' + m.signed.pages + ' pages · uploaded by ' + esc(m.signed.by) + '</small></div>' +
        '<button class="btn sm ghost">View</button></div>' +
        '<div class="notice green" style="margin:13px 0 0"><span class="dot"></span><span>A circulated MoM is immutable. A correction is issued as a <b>corrigendum linked to the original</b>, never as a silent replacement.</span></div>' +
      '</div></div>' +
      '<div class="card"><div class="hd"><h3>Circulation log</h3><span class="tag">' + m.signed.dispatch.length + ' recipients</span></div>' +
        '<table><thead><tr><th>Recipient</th><th style="width:132px">Channel</th><th style="width:140px">Delivery</th><th style="width:74px">Opened</th></tr></thead><tbody>' +
        m.signed.dispatch.map(function (r) {
          var bad = /Failed/.test(r[2]);
          return '<tr><td class="strong">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td>' +
            '<td><span class="chip ' + (bad ? 's-delay' : 's-done') + '">' + esc(r[2]) + '</span></td><td>' + esc(r[3]) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
  }

  var history = m.momHistory ? '<div class="card" style="margin-top:16px"><div class="hd"><h3>Approval history</h3></div><div class="bd"><div class="tl">' +
    m.momHistory.map(function (h) {
      return '<div class="e"><div class="rail"><div class="bub ' + h[0] + '">' + (h[0] === 'ok' ? TICK : h[0] === 'now' ? '●' : '') + '</div><div class="stem"></div></div>' +
        '<div class="body"><b>' + esc(h[1]) + '</b><div class="who">' + esc(h[2]) + '</div></div></div>';
    }).join('') + '</div></div></div>' : '';

  return '<div class="cols c-32">' + paper + '<div>' + side + history + '</div></div>';
}

/* =====================================================================
   The generated MoM — an A4 document, printable to PDF.
   Shared by the meeting's Signed MoM tab and the MoM register.
   ===================================================================== */
function momVersion(m) {
  if (m.momState === 'signed') return 'Final';
  var subs = (m.momHistory || []).filter(function (h) { return /submitted/i.test(h[1]); }).length;
  return 'v' + Math.max(subs, 1);
}
function momStamp(m) {
  return { none: 'NOT GENERATED', draft: 'DRAFT', submitted: 'DRAFT', returned: 'DRAFT',
           approved: 'APPROVED', signed: '' }[m.momState];
}

/** The A4 sheet on its own — no card, no buttons. Used for screen and for print. */
function momSheet(m) {
  var its = meetingItems(m.id);
  var acts = its.filter(function (i) { return i.type === 'action'; });
  var clas = its.filter(function (i) { return i.type === 'clarification'; });
  var carried = m.agenda.filter(function (a) { return a.carry; });
  var stamp = momStamp(m);
  var signedOff = m.momState === 'signed';

  function att(kind) {
    return m.invitees.filter(function (i) { return (m.attend || {})[i] === kind; });
  }
  var present = att('P'), virtual = att('V'), absent = att('A');
  var unmarked = m.invitees.filter(function (i) { return !(m.attend || {})[i]; });

  var attendRows = m.invitees.map(function (id, n) {
    var x = u(id), v = (m.attend || {})[id];
    var label = { P: 'Present', V: 'Virtual', A: 'Absent' }[v] || 'Not marked';
    return '<tr><td class="n">' + (n + 1) + '</td><td>' + esc(x.name) + (id === m.chair ? ' <b>(Chair)</b>' : '') + '</td>' +
      '<td>' + esc(dg(x.dg).name) + '</td><td>' + esc(x.dept) + '</td><td>' + label + '</td></tr>';
  }).join('');

  var carriedBlock = carried.length
    ? '<h4>3. Review of items carried forward</h4>' +
      '<p>Open items from the previous review were taken up as agenda item 0. Their status as recorded at the close of ' +
      'this meeting is shown in the action and clarification tables below; any item still open is carried forward again.</p>'
    : '';

  var actRows = acts.length ? acts.map(function (a) {
    return '<tr>' +
      '<td><b>' + esc(a.id) + '</b></td>' +
      '<td>' + esc(a.desc) + '</td>' +
      '<td>' + esc(u(a.raised).name) + '</td>' +
      '<td>' + a.owners.map(function (o) { return esc(u(o).name); }).join(',<br>') + '</td>' +
      '<td>' + fmt(a.due) + '</td>' +
      '<td>' + esc(a.pri || '—') + '</td>' +
      '<td>' + esc(a.status) + '</td>' +
      '<td>' + esc(a.rem || '—') + '</td></tr>';
  }).join('') : '<tr><td colspan="8" style="text-align:center;color:#8A97A6">No action items arose from this meeting.</td></tr>';

  var claRows = clas.length ? clas.map(function (c) {
    return '<tr>' +
      '<td><b>' + esc(c.id) + '</b></td>' +
      '<td>' + esc(c.desc) + '</td>' +
      '<td>' + esc(u(c.raised).name) + '</td>' +
      '<td>' + (c.respBy ? esc(u(c.respBy).name) : '—') + '</td>' +
      '<td>' + esc(c.status) + '</td>' +
      '<td>' + esc(c.rem || '—') + '</td></tr>';
  }).join('') : '<tr><td colspan="6" style="text-align:center;color:#8A97A6">No clarifications were recorded.</td></tr>';

  return '<div class="doc-wrap"><div class="doc" id="momSheet">' +
    (stamp ? '<div class="doc-wm' + (m.momState === 'approved' ? ' ok' : '') + '"><span>' + stamp + '</span></div>' : '') +

    '<div class="doc-hd">' +
      '<div class="seal">' + ic('seal', 26) + '</div>' +
      '<div class="t"><div class="o">Government of the State · Municipal Administration Department</div>' +
        '<h1>Urban Challenge Fund</h1>' +
        '<div class="s">Minutes of Meeting</div></div>' +
      '<div class="r">Ref<b>' + esc(mcodeText(m)) + '</b>' +
        'Version <b>' + momVersion(m) + '</b>' +
        'Dated <b>' + fmt(m.date) + '</b></div>' +
    '</div>' +

    '<table class="doc-meta"><tbody>' +
      '<tr><th>Meeting</th><td colspan="3"><b>' + esc(m.title) + '</b></td></tr>' +
      '<tr><th>Date</th><td>' + fmt(m.date) + '</td><th>Time</th><td>' + esc(m.start) + ' – ' + esc(m.end) + ' hrs</td></tr>' +
      '<tr><th>Chairperson</th><td>' + esc(u(m.chair).name) + ' · ' + esc(dg(u(m.chair).dg).name) + '</td>' +
        '<th>Venue</th><td>' + esc(m.venue) + (m.link ? '<br><span style="color:#64707F">' + esc(m.link) + '</span>' : '') + '</td></tr>' +
      '<tr><th>Type of meeting</th><td>' + esc(m.cat) + ' · ' + (m.type === 'instant' ? 'Instant meeting' : 'Scheduled meeting') + '</td>' +
        '<th>Projects</th><td>' + m.prj.map(function (x) { return esc(prj(x).name + ' — ' + prj(x).full); }).join('<br>') + '</td></tr>' +
    '</tbody></table>' +

    (m.type === 'instant'
      ? '<div class="doc-note"><b>Instant meeting.</b> This meeting was convened at short notice. The agenda was not circulated in advance and invitees had no opportunity to add to it before it was held.</div>'
      : '') +

    '<h4>1. Attendance</h4>' +
    '<p>Invited ' + m.invitees.length + ' · present ' + present.length + ' · attended virtually ' + virtual.length +
      ' · absent ' + absent.length + (unmarked.length ? ' · not marked ' + unmarked.length : '') + '.</p>' +
    '<table class="doc-tbl"><thead><tr><th class="n">#</th><th style="width:30%">Name</th><th style="width:24%">Designation</th>' +
      '<th style="width:24%">Department</th><th style="width:14%">Attendance</th></tr></thead><tbody>' + attendRows + '</tbody></table>' +

    '<h4>2. Agenda as taken</h4>' +
    '<table class="doc-tbl"><thead><tr><th class="n">#</th><th style="width:56%">Agenda item</th><th style="width:20%">Project</th><th style="width:20%">Raised by</th></tr></thead><tbody>' +
      (m.agenda.length ? m.agenda.map(function (a, n) {
        return '<tr><td class="n">' + (a.carry ? '0' : n) + '</td><td>' + esc(a.t) + (a.carry ? ' <i>(carried forward)</i>' : '') + '</td>' +
          '<td>' + (a.p ? esc(prj(a.p).name) : 'All projects') + '</td>' +
          '<td>' + (a.by === 'system' ? 'System' : esc(u(a.by).name)) + '</td></tr>';
      }).join('') : '<tr><td colspan="4" style="text-align:center;color:#8A97A6">No written agenda.</td></tr>') +
    '</tbody></table>' +

    carriedBlock +

    '<h4>' + (carried.length ? '4' : '3') + '. Discussion and decisions</h4>' +
    '<div class="mins">' + (m.minutes || '<p><i>Minutes not recorded.</i></p>') + '</div>' +

    '<h4>' + (carried.length ? '5' : '4') + '. Action items arising</h4>' +
    '<table class="doc-tbl"><thead><tr><th style="width:8%">ID</th><th style="width:27%">Action</th>' +
      '<th style="width:11%">Raised by</th><th style="width:14%">Responsible officer(s)</th>' +
      '<th style="width:9%">Due date</th><th style="width:8%">Priority</th><th style="width:9%">Status</th>' +
      '<th style="width:14%">Remarks</th></tr></thead><tbody>' + actRows + '</tbody></table>' +
    (acts.length ? '<div class="doc-note">Where more than one officer is named, all are <b>jointly and equally accountable</b>. Any one of them may report the action complete; the completion is then confirmed by the competent authority before the item closes.</div>' : '') +

    '<h4>' + (carried.length ? '6' : '5') + '. Clarifications and additional points</h4>' +
    '<table class="doc-tbl"><thead><tr><th style="width:8%">ID</th><th style="width:34%">Clarification</th>' +
      '<th style="width:13%">Raised by</th><th style="width:13%">Responded by</th>' +
      '<th style="width:10%">Status</th><th style="width:22%">Remarks</th></tr></thead><tbody>' + claRows + '</tbody></table>' +

    '<h4>' + (carried.length ? '7' : '6') + '. Circulation and next review</h4>' +
    '<p>These minutes are circulated to all invitees listed at section 1 and to the standing head-office recipients. ' +
      'Open items are carried forward to the next review for the project' + (m.prj.length > 1 ? 's' : '') + ' named above.</p>' +

    '<div class="doc-sign">' +
      '<div class="box"><div class="line"></div><b>' + esc(u(m.chair).name) + '</b>' + esc(dg(u(m.chair).dg).name) + '<br>Chairperson</div>' +
      '<div class="box"><div class="line"></div><b>' + esc(u(m.by).name) + '</b>' + esc(dg(u(m.by).dg).name) + '<br>Meeting Coordinator</div>' +
    '</div>' +

    '<div class="doc-ft">' +
      '<span>' + esc(mcodeText(m)) + ' · ' + esc(m.title) + '</span>' +
      '<span>' + (signedOff ? 'Signed copy uploaded ' + fmt(m.signed.date) : 'System-generated draft · not valid until signed') + ' · generated ' + fmt(TODAY) + '</span>' +
    '</div>' +

  '</div></div>';
}

/** The sheet wrapped in a card, with the print-to-PDF control. */
function momPaper(m) {
  var signedOff = m.momState === 'signed';
  return '<div class="card"><div class="hd">' +
      '<h3>Minutes of Meeting — ' + (signedOff ? 'signed copy' : 'draft') + '</h3>' +
      '<span class="chip ' + (signedOff ? 's-done' : 'm-appr') + '">' + (signedOff ? 'Final' : momStamp(m) + ' ' + momVersion(m)) + '</span>' +
      '<span class="tag">A4 · assembled from recorded data</span>' +
      '<span style="margin-left:12px" class="flex">' +
      '<button class="btn sm ghost" data-act="print-mom" data-id="' + m.id + '">Download PDF</button>' +
      '<button class="btn sm ghost" data-act="print-mom" data-id="' + m.id + '">Print</button>' +
      shareBtn('mom', m.id, 'Email / WhatsApp', 'dark') + '</span>' +
    '</div>' + momSheet(m) + '</div>';
}


/* ==================== The typed entry form (Action ⇄ Clarification) ==================== */
function newItemForm(type, mid, editId) {
  var ex = editId ? item(editId) : null;
  STATE.form = ex ? {
    id: ex.id, type: ex.type, m: ex.m, p: ex.p, desc: ex.desc, raised: ex.raised,
    owners: (ex.owners || []).slice(), due: ex.due || '', pri: ex.pri || 'Medium',
    status: ex.status, respBy: ex.respBy || '', rem: ex.rem || ''
  } : {
    id: null, type: type || 'action', m: mid, p: (mtg(mid) || {}).prj ? mtg(mid).prj[0] : 'P1',
    desc: '', raised: STATE.user.id, owners: [], due: '', pri: 'Medium',
    status: (type === 'clarification' ? 'Open' : 'In Progress'), respBy: '', rem: ''
  };
  renderItemForm();
}

function renderItemForm() {
  var f = STATE.form, isAct = f.type === 'action';
  var m = mtg(f.m);
  var officers = USERS.filter(function (x) { return x.login; });
  var pOpts = (m ? m.prj : myProjects()).map(function (p) { return { v: p, l: prj(p).name + ' — ' + prj(p).full }; });

  var ownerChips = f.owners.length
    ? f.owners.map(function (id) {
        return '<span class="token">' + avatar(id, 20) + esc(u(id).name) +
          '<span class="x" data-act="f-owner" data-id="' + id + '">✕</span></span>';
      }).join('')
    : '<span class="muted" style="font-size:12px">Nobody selected yet</span>';

  var ownerList = '<div class="ms-list">' + officers.map(function (x) {
    var on = f.owners.indexOf(x.id) >= 0;
    return '<div class="ms-row" data-act="f-owner" data-id="' + x.id + '">' +
      '<span class="check' + (on ? ' on' : '') + '">' + (on ? TICK : '') + '</span>' + avatar(x.id, 24) +
      '<div style="flex:1"><b>' + esc(x.name) + '</b> <small>· ' + esc(dg(x.dg).name) + ' · ' + esc(x.dept) + '</small></div>' +
      (x.prj === 'ALL' ? '<span class="ptag">All projects</span>' : '<span class="ptag">' + x.prj.map(function (p) { return prj(p).name; }).join(', ') + '</span>') +
      '</div>';
  }).join('') + '</div>';

  var common =
    '<div class="field"><label>' + (isAct ? 'Action description' : 'Clarification description') + '<span class="req">*</span></label>' +
      '<textarea class="i" id="fDesc" data-f="desc" placeholder="' +
      (isAct ? 'What has to be done — short, specific and testable' : 'What needs to be clarified') + '">' + esc(f.desc) + '</textarea>' +
      '<div class="err" id="errDesc">A description is required</div></div>' +
    '<div class="row3">' +
      '<div class="field"><label>Raised by</label>' + sel('fRaised', officers.map(function (x) { return { v: x.id, l: x.name + ' · ' + dg(x.dg).name }; }), f.raised, ' data-f="raised"') + '</div>' +
      '<div class="field"><label>Project</label>' + sel('fPrj', pOpts, f.p, ' data-f="p"') + '</div>' +
      '<div class="field"><label>Status</label>' + sel('fStatus', isAct ? ACTION_STATUSES : CLARIF_STATUSES, f.status, ' data-f="status"') + '</div>' +
    '</div>';

  var specific = isAct
    ? '<div class="field"><label>Responsible person<span class="req">*</span> <span class="hint">— pick one or more officers; all of them are equally accountable</span></label>' +

      '<div class="row3">' +
        '<div class="field"><label>Due date<span class="req">*</span></label><input class="i" type="date" id="fDue" data-f="due" value="' + esc(f.due) + '">' +

        '<div class="field"><label>Meeting</label><input class="i" value="' + esc(m ? mcodeText(m) : '—') + '" disabled></div>' +

    : '<div class="notice" style="margin-bottom:0"><span class="dot"></span><span>Clarifications run <b>Open → Responded → Closed</b>, a separate ladder from actions, so the two dashboard charts stay readable. They carry forward into the next meeting until they are Closed.</span></div>';

  openModal(

      '<div class="field"><label>Entry type</label>' +
        sel('fType', [{ v: 'action', l: 'Action — something someone must do by a date' }, { v: 'clarification', l: 'Clarification — a point to be answered, not a task' }], f.type, ' data-f="type"') +
      '</div>' +
      common + specific +

      (f.id ? '' : '<button class="btn ghost" data-act="save-item" data-again="1">Save &amp; add another</button>') +
      '<button class="btn primary" data-act="save-item">' + (f.id ? 'Save changes' : 'Add entry') + '</button></div>', true);
}

function saveItem(again) {
  var f = STATE.form, isAct = f.type === 'action';
  var err = {};
  if (!f.desc.trim()) err.desc = 1;
  if (isAct && !f.owners.length) err.owners = 1;
  if (isAct && !f.due) err.due = 1;
  STATE.formErr = err;
  if (Object.keys(err).length) {
    if (err.desc) { var e = $('errDesc'); if (e) e.classList.add('on'); var i1 = $('fDesc'); if (i1) i1.classList.add('bad'); }
    if (err.owners) { var e2 = $('errOwners'); if (e2) e2.classList.add('on'); }
    if (err.due) { var e3 = $('errDue'); if (e3) e3.classList.add('on'); var i3 = $('fDue'); if (i3) i3.classList.add('bad'); }
    toast('Fill in the fields marked in red', 'bad');
    return;
  }

  if (f.id) {
    var ex = item(f.id);
    ex.type = f.type; ex.p = f.p; ex.desc = f.desc.trim(); ex.raised = f.raised; ex.status = f.status; ex.rem = f.rem.trim();
    if (isAct) { ex.owners = f.owners.slice(); ex.due = f.due; ex.pri = f.pri; delete ex.respBy; }
    else { ex.respBy = f.respBy; delete ex.owners; delete ex.due; delete ex.pri; }
    ex.hist.push([TODAY + ' now', 'Edited', STATE.user.name]);
    toast(f.id + ' updated', 'ok');
  } else {
    var pre = isAct ? 'ACT-' : 'CLA-';
    var n = ITEMS.filter(function (x) { return x.type === f.type; }).length + 1;
    var id = pre + String(n + (isAct ? 20 : 20)).padStart(2, '0');
    var rec = { id: id, type: f.type, m: f.m, p: f.p, desc: f.desc.trim(), raised: f.raised, status: f.status, rem: f.rem.trim(),
      hist: [[TODAY + ' now', 'Created from the minutes', STATE.user.name]] };
    if (isAct) { rec.owners = f.owners.slice(); rec.due = f.due; rec.pri = f.pri; } else { rec.respBy = f.respBy; }
    ITEMS.push(rec);
    toast(id + ' added — it is now in the register', 'ok');
  }

  if (again) { newItemForm(f.type, f.m); } else { closeModal(); }
  render();
}

/* ==================== Register ==================== */
function viewRegister() {
  var f = STATE.rf;
  var list = visibleItems().filter(function (it) {
    if (f.type && it.type !== f.type) return false;
    if (f.status && it.status !== f.status) return false;
    if (f.prj && it.p !== f.prj) return false;
    if (f.owner) {
      if (it.type === 'action') { if ((it.owners || []).indexOf(f.owner) < 0) return false; }
      else if (it.respBy !== f.owner && it.raised !== f.owner) return false;
    }
    if (f.mine && !ownsItem(it)) return false;
    if (f.q && (it.id + ' ' + it.desc).toLowerCase().indexOf(f.q.toLowerCase()) < 0) return false;
    return true;
  });

  var acts = list.filter(function (i) { return i.type === 'action'; });
  var clas = list.filter(function (i) { return i.type === 'clarification'; });

  var rows = list.length ? list.map(function (it) {
    var isAct = it.type === 'action';
    return '<tr class="clickable' + (STATE.iid === it.id ? ' sel' : '') + '" data-act="open-item" data-id="' + it.id + '">' +
      '<td><span class="aid">' + it.id + '</span></td>' +
      '<td>' + typePill(it.type) + '</td>' +
      '<td><span class="strong">' + esc(it.desc) + '</span><div class="muted" style="font-size:11px;margin-top:2px">' +
        ptag(it.p) + ' · from ' + esc(mcodeText(mtg(it.m) || { code: ['—', '—', '—'] })) + '</div></td>' +
      '<td>' + (isAct ? ownerStack(it.owners) : (it.respBy ? ownerStack([it.respBy]) : '<span class="muted">unanswered</span>')) + '</td>' +
      '<td class="nowrap">' + (isAct ? fmt(it.due) : '<span class="muted">—</span>') + '</td>' +
      '<td>' + (isAct ? priChip(it.pri) : '<span class="muted">—</span>') + '</td>' +
      '<td>' + statusChip(it.status) + '</td>' +
      '<td class="muted nowrap" style="font-size:11.5px">' + ageing(it) + '</td></tr>';
  }).join('') : emptyRow(8, 'Nothing matches these filters.');

  var ownerOpts = [{ v: '', l: 'Anyone' }].concat(USERS.filter(function (x) { return x.login; }).map(function (x) { return { v: x.id, l: x.name }; }));

  return '<div class="page-head"><div><div class="eyebrow">Tracking</div><h2>Action &amp; clarification register</h2>' +
      '<p>Everything raised in any meeting, in one list. Actions run In Progress → Under Review → Completed; clarifications run Open → Responded → Closed. ' +
      (seesAll() ? 'You see every project.' : 'You see only the projects you are mapped to.') + '</p></div>' +
      '<div class="actions"><button class="btn ghost">Export CSV</button>' + shareBtn('report', 'Action Taken Report', 'Share register', 'ghost') + '<button class="btn dark">Send reminders</button></div></div>' +
    '<div class="kpis">' +
      '<div class="kpi"><div class="num">' + acts.length + '</div><div class="lab">Actions in view</div></div>' +
      '<div class="kpi warn"><div class="num">' + acts.filter(function (a) { return a.status === 'In Progress'; }).length + '</div><div class="lab">In progress</div></div>' +
      '<div class="kpi hot"><div class="num">' + acts.filter(function (a) { return a.status === 'Delayed'; }).length + '</div><div class="lab">Delayed</div></div>' +
      '<div class="kpi review"><div class="num">' + clas.filter(function (c) { return c.status !== 'Closed'; }).length + '</div><div class="lab">Clarifications still open</div></div>' +
    '</div>' +
    '<div class="filtbar">' +
      '<div class="fgrp"><label>Type</label>' + sel('rfType', [{ v: '', l: 'Actions and clarifications' }, { v: 'action', l: 'Actions only' }, { v: 'clarification', l: 'Clarifications only' }], f.type, ' data-rf="type"') + '</div>' +
      '<div class="fgrp"><label>Status</label>' + sel('rfStatus', [{ v: '', l: 'Any status' }].concat(ACTION_STATUSES).concat(CLARIF_STATUSES), f.status, ' data-rf="status"') + '</div>' +
      '<div class="fgrp"><label>Project</label>' + sel('rfPrj', [{ v: '', l: 'All projects' }].concat(myProjects().map(function (p) { return { v: p, l: prj(p).name }; })), f.prj, ' data-rf="prj"') + '</div>' +
      '<div class="fgrp"><label>Officer</label>' + sel('rfOwner', ownerOpts, f.owner, ' data-rf="owner"') + '</div>' +
      '<div class="fgrp"><label>Search</label><input class="i" id="rfQ" data-rf="q" value="' + esc(f.q) + '" placeholder="Item ID or text…"></div>' +
      '<div class="fgrp" style="flex:0 0 auto;min-width:0"><label>&nbsp;</label>' +
        '<button class="btn ' + (f.mine ? 'dark' : 'ghost') + '" data-act="rf-mine">Only mine</button></div>' +
    '</div>' +
    '<div class="card" style="overflow-x:auto"><table>' +
      '<thead><tr><th style="width:74px">Item</th><th style="width:104px">Type</th><th>Description</th>' +
      '<th style="width:200px">Responsible / responded</th><th style="width:100px">Due</th><th style="width:88px">Priority</th>' +
      '<th style="width:126px">Status</th><th style="width:104px">Ageing</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    guide('One register, two vocabularies', [
      'Clarifications sit here alongside actions because they now have an owner and a status — they are tracked work, and an untracked second backlog is exactly how a clarification quietly dies. The <b>Type</b> filter separates them whenever you want them apart.',
      'Both carry forward: an open action <i>and</i> an unclosed clarification are offered on the next meeting’s agenda item 0.'
    ]);
}

/* ---------------- item drawer ---------------- */
function itemDrawer(id) {
  var it = item(id); if (!it) return;
  var isAct = it.type === 'action';
  var m = mtg(it.m);
  var mayUpdate = ownsItem(it) || can('create_items');
  var mayConfirm = can('confirm_completion') && it.status === 'Under Review';
  var mayRespond = (can('respond_clarification') || it.respBy === STATE.user.id) && it.status !== 'Closed';

  var chain = isAct
    ? [['ok', 'Raised in ' + mcodeText(m), esc(u(it.raised).name) + ' · ' + fmt(m.date)],
       [it.status === 'In Progress' || it.status === 'Delayed' ? 'now' : 'ok', 'Work in progress', it.owners.map(function (o) { return u(o).name; }).join(', ')],
       [it.status === 'Under Review' ? 'now' : (it.status === 'Completed' ? 'ok' : 'wait'), 'Reported complete', it.status === 'In Progress' || it.status === 'Delayed' ? 'not yet' : 'by a responsible officer'],
       [it.status === 'Completed' ? 'ok' : 'wait', 'Confirmed as completed', it.status === 'Completed' ? 'confirmed' : 'pending a senior officer']]
    : [['ok', 'Raised in ' + mcodeText(m), esc(u(it.raised).name) + ' · ' + fmt(m.date)],
       [it.status === 'Open' ? 'now' : 'ok', 'Response', it.respBy ? esc(u(it.respBy).name) : 'nobody assigned yet'],
       [it.status === 'Closed' ? 'ok' : 'wait', 'Closed', it.status === 'Closed' ? 'closed' : 'stays open until the raiser accepts the answer']];

  openDrawer(
    '<div class="d-hd"><div class="flex" style="justify-content:space-between"><span class="aid">' + it.id + '</span>' +
      '<span class="flex" style="gap:8px">' + shareBtn('item', it.id, 'Share') +
      '<button class="lnk" data-act="close-drawer" style="font-size:18px">✕</button></span></div>' +
      '<h3 style="margin:6px 0 8px;font-size:16px;color:var(--navy);font-family:var(--serif);line-height:1.4;font-weight:600">' + esc(it.desc) + '</h3>' +
      '<div class="flex" style="gap:8px">' + typePill(it.type) + ptag(it.p) + (isAct ? priChip(it.pri) : '') + statusChip(it.status) + '</div></div>' +
    '<div class="d-bd">' +
      '<div class="row2">' +
        '<div class="field"><label>' + (isAct ? 'Responsible officers — jointly accountable' : 'Responded by') + '</label>' +
          '<div class="i" style="min-height:38px;display:flex;align-items:center;flex-wrap:wrap;gap:7px">' +
          (isAct ? it.owners.map(function (o) { return '<span class="token" style="padding:2px 9px">' + avatar(o, 18) + esc(u(o).name) + '</span>'; }).join('')
                 : (it.respBy ? '<span class="token" style="padding:2px 9px">' + avatar(it.respBy, 18) + esc(u(it.respBy).name) + '</span>' : '<span class="muted">Nobody yet</span>')) +
          '</div></div>' +
        '<div class="field"><label>' + (isAct ? 'Due' : 'Raised by') + '</label><input class="i" value="' +
          (isAct ? esc(fmt(it.due) + ' · ' + ageing(it)) : esc(u(it.raised).name)) + '" disabled></div>' +
      '</div>' +
      '<div class="section-label" style="margin-top:6px">' + (isAct ? 'Verification' : 'Clarification lifecycle') + '</div>' +
      (isAct ? '<div class="notice violet"><span class="dot"></span><span>All responsible officers are <b>equally accountable</b> — any one of them may report it complete, and the confirmation then applies to the item as a whole. ' + pendingTag('who confirms: to be decided') + '</span></div>' : '') +
      '<div class="tl">' + chain.map(function (c) {
        return '<div class="e"><div class="rail"><div class="bub ' + c[0] + '">' + (c[0] === 'ok' ? TICK : c[0] === 'now' ? '●' : '') + '</div><div class="stem"></div></div>' +
          '<div class="body"><b>' + c[1] + '</b><div class="who">' + c[2] + '</div></div></div>';
      }).join('') + '</div>' +
      (it.rem ? '<div class="section-label">Remarks</div><div class="arow" style="margin:0"><div style="font-size:12.5px">' + esc(it.rem) + '</div></div>' : '') +
      '<div class="section-label">History</div>' +
      '<table><tbody>' + it.hist.map(function (h) {
        return '<tr><td class="nowrap muted" style="width:118px;font-size:11px">' + esc(h[0]) + '</td>' +
          '<td style="font-size:11.5px">' + esc(h[1]) + '</td><td class="nowrap muted" style="font-size:11px">' + esc(h[2]) + '</td></tr>';
      }).join('') + '</tbody></table>' +
    '</div>' +
    '<div class="d-ft">' +
      (isAct
        ? (mayConfirm ? '<button class="btn ghost" data-act="item-status" data-id="' + it.id + '" data-v="In Progress">↩ Send back</button>' +
                        '<button class="btn good" data-act="item-status" data-id="' + it.id + '" data-v="Completed">✓ Confirm as completed</button>'
           : (mayUpdate && it.status !== 'Completed'
              ? '<button class="btn ghost" data-act="item-status" data-id="' + it.id + '" data-v="Delayed">Flag as delayed</button>' +
                '<button class="btn good" data-act="item-status" data-id="' + it.id + '" data-v="Under Review">✓ Report as complete</button>'
              : '<span class="muted" style="font-size:12px;align-self:center">Nothing for you to do on this item.</span>'))
        : (mayRespond
            ? '<button class="btn ghost" data-act="item-status" data-id="' + it.id + '" data-v="Responded">Mark as responded</button>' +
              '<button class="btn good" data-act="item-status" data-id="' + it.id + '" data-v="Closed">Close clarification</button>'
            : '<span class="muted" style="font-size:12px;align-self:center">This clarification is closed.</span>')) +
    '</div>');
}

  if (STATE.pid) return viewProjectDetail();

         ['ULBs', p.ulbs.length], ['Cost', '₹' + p.cost.toFixed(2) + ' cr'],

    '<div class="cols c-3">' + cards + '</div>' +

  if (m.momState === 'signed') return ['s-done', 'Finalised'];

  if (m.minutes) return ['m-appr', 'Draft'];
  return ['m-draft', 'Not started'];
}

  var mayWrite = can('record_minutes') && m.momState !== 'signed' && m.momState !== 'submitted' && m.momState !== 'approved';
  var locked = m.momState === 'submitted' || m.momState === 'approved' || m.momState === 'signed';

  var picker = '<div class="card"><div class="hd"><h3>Meetings held</h3><span class="tag">' + list.length + '</span></div><div class="bd" style="padding:8px">' +
    list.map(function (x) {

        (on ? 'background:var(--ice);border:1px solid var(--ice2)' : 'border:1px solid transparent') + '">' +
        '<div class="flex" style="gap:8px;justify-content:space-between"><span class="mcode">' + mcode(x) + '</span>' +
        '<span class="tpill ' + (x.type === 'instant' ? 'instant">Instant' : 'sched">Scheduled') + '</span></div>' +
        '<b style="font-size:12.5px;color:var(--navy);display:block;margin:4px 0 3px;line-height:1.35">' + esc(x.title) + '</b>' +
        '<div class="flex" style="gap:7px"><span class="muted" style="font-size:11px">' + fmt(x.date) + '</span>' +
        '<span class="chip ' + st[0] + '" style="margin-left:auto">' + st[1] + '</span></div></div>';
    }).join('') + '</div></div>';

  var editor = '<div class="card"><div class="hd"><h3>Minutes — ' + esc(mcodeText(m)) + '</h3>' +
    '<span class="tag">' + minutesState(m)[1] + '</span>' +
    '<span style="margin-left:12px" class="flex">' + shareBtn('mom', m.id, 'Share MoM') +
    '<button class="btn sm ghost" data-act="open-meeting" data-id="' + m.id + '" data-tab="items">Open the full meeting</button></span></div>' +
    '<div class="bd">' +
    (locked ? '<div class="notice amber"><span class="dot"></span><span>These minutes are <b>locked</b> — the MoM has been submitted for approval. Return the MoM to reopen them.</span></div>' : '') +
    (mayWrite
      ? '<div class="rte-bar">' +
          '<button data-act="rte" data-cmd="bold"><b>B</b></button><button data-act="rte" data-cmd="italic"><i>I</i></button>' +
          '<button data-act="rte" data-cmd="underline"><u>U</u></button><span class="sep"></span>' +
          '<button data-act="rte" data-cmd="hiliteColor" data-val="#FFE9A8" style="background:#FFE9A8">H</button>' +
          '<button data-act="rte" data-cmd="hiliteColor" data-val="transparent">⌫H</button><span class="sep"></span>' +
          '<button data-act="rte" data-cmd="insertOrderedList">1.</button><button data-act="rte" data-cmd="insertUnorderedList">•</button><span class="sep"></span>' +
          '<button data-act="rte" data-cmd="formatBlock" data-val="H3">Heading</button><button data-act="rte" data-cmd="formatBlock" data-val="P">Normal</button>' +
          '<span class="sep"></span><button data-act="save-minutes" data-id="' + m.id + '">Save draft</button>' +
        '</div><div class="rte" id="rteBox" contenteditable="true" style="min-height:340px">' + (m.minutes || '<p><i>Type or paste the minutes here…</i></p>') + '</div>'
      : '<div class="rte" style="border-radius:10px;min-height:auto">' + (m.minutes || '<p class="muted">No minutes recorded yet.</p>') + '</div>') +
    '</div></div>';

  var capture = '<div class="card"><div class="hd"><h3>Entries from these minutes</h3>' +
    '<span class="tag">' + acts.length + ' action' + (acts.length === 1 ? '' : 's') + ' · ' + clas.length + ' clarification' + (clas.length === 1 ? '' : 's') + '</span>' +
    (can('create_items') && !locked ? '<button class="btn sm primary" style="margin-left:12px" data-act="new-item-for" data-id="' + m.id + '" data-type="action">+ Add entry</button>' : '') + '</div>' +
    '<div class="bd">' + (its.length ? its.map(function (it) {
      return '<div class="flex" data-act="open-item" data-id="' + it.id + '" style="gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:7px;cursor:pointer">' +
        '<span class="aid">' + it.id + '</span>' + typePill(it.type) +
        '<span style="flex:1;min-width:0;color:var(--navy);font-size:12.5px">' + esc(it.desc) + '</span>' +
        (it.type === 'action' ? '<span class="muted" style="font-size:11.5px">' + it.owners.map(function (o) { return esc(u(o).name); }).join(', ') + '</span>' : '') +
        statusChip(it.status) + '</div>';
    }).join('') : '<div class="empty">Nothing captured from these minutes yet. Use <b>+ Add entry</b> and choose Action or Clarification.</div>') +
    '</div></div>';

  var next = '<div class="card"><div class="hd"><h3>Next step</h3></div><div class="bd">' +
    (m.momState === 'none'
      ? '<p class="muted" style="font-size:12.5px;margin:0 0 12px">When the minutes are complete, generate the MoM. It is assembled from the attendance, these minutes and the entries above — nothing is retyped.</p>' +
        '<button class="btn primary" style="width:100%;justify-content:center" data-act="mom" data-id="' + m.id + '" data-to="draft"' + (mayWrite ? '' : ' disabled') + '>Generate the MoM →</button>'
      : '<div class="notice green"><span class="dot"></span><span>The MoM for this meeting is <b>' +
        ({ draft: 'a draft', submitted: 'awaiting approval', returned: 'returned for correction', approved: 'approved and awaiting signature', signed: 'signed and circulated' })[m.momState] + '</b>.</span></div>' +
        '<button class="btn ghost" style="width:100%;justify-content:center" data-act="go-mom" data-id="' + m.id + '">Open it in the MoM register →</button>') +
    '</div></div>';

  return '<div class="page-head"><div><div class="eyebrow">Meetings</div><h2>Minutes editor</h2>' +
      '<p>Pick a meeting on the left and write its minutes here. Every commitment in the text becomes an entry below — an <b>action</b> with responsible officers and a date, or a <b>clarification</b> with a responder.</p></div></div>' +
    '<div class="cols c-23">' + picker + '<div class="stack" style="gap:16px">' + editor + capture + next + '</div></div>';
