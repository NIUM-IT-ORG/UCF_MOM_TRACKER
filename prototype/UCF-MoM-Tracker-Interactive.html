<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCF Meeting &amp; Action Item Tracker — interactive wireframe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --navy:#1D3557; --navy-d:#13233D; --blue:#2E5FA3; --steel:#5E7DAA;
  --accent:#D9772B; --accent-d:#B25E1B;
  --bg:#F3F6FA; --card:#FFFFFF; --ink:#1E2733; --muted:#64707F;
  --line:#DCE4EE; --ice:#EAF1F9; --ice2:#D8E4F2;
  --ok:#1B8A57; --warn:#B07A0C; --danger:#BF3B2B; --review:#7D3C98;
  --radius:12px; --shadow:0 2px 10px rgba(29,53,87,.08);
  --serif:"Bitter",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.55;overflow:hidden}
a{color:var(--blue);text-decoration:none;cursor:pointer}
a:hover{color:var(--navy)}
button{font-family:var(--sans)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px 1fr;height:100vh}
.sidebar{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-d) 100%);color:#D6E2F2;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.brand{padding:18px 16px 14px;display:flex;gap:11px;align-items:center;border-bottom:1px solid rgba(255,255,255,.09);flex:0 0 auto}
.brand .mark{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.brand h1{font-family:var(--serif);font-size:16px;margin:0;color:#fff;font-weight:700}
.brand span{display:block;font-size:9.5px;color:#8FA8CC;letter-spacing:1.3px;text-transform:uppercase;margin-top:2px;line-height:1.4}
.nav{padding:10px 11px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px}
.nav .group{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:#7A8FB4;padding:14px 12px 5px;font-weight:800}
.nav a{display:flex;gap:11px;align-items:center;padding:9px 12px;border-radius:9px;color:#C5D4EA;font-size:13px;transition:.12s}
.nav a svg{width:17px;height:17px;flex:0 0 auto;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:var(--blue);color:#fff}
.nav a .pill{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:2px 7px;min-width:20px;text-align:center}
.nav a .pill.g{background:#3D5C8F}
.nav a.locked{opacity:.34;pointer-events:none}
.sidebar .foot{padding:11px 16px;border-top:1px solid rgba(255,255,255,.09);font-size:10px;color:#7E93B8;line-height:1.6;flex:0 0 auto}
.sidebar .foot b{color:#A5BEE3}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{min-height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:9px 22px;flex:0 0 auto;flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--muted)}
.crumb b{color:var(--ink)}
.rolebox{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rolebox .lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.chip-user{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:22px;background:#fff}
.chip-user .av{width:29px;height:29px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.chip-user .who b{font-size:12px;display:block;line-height:1.2}
.chip-user .who small{color:var(--accent);font-size:9.5px;font-weight:700}
.stage{flex:1;overflow-y:auto;min-height:0}
.content{padding:22px 26px 60px;max-width:1420px}

/* ---------- typography / page head ---------- */
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head .eyebrow{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:800}
.page-head h2{margin:2px 0 0;font-size:23px;color:var(--navy);font-family:var(--serif);font-weight:600;text-wrap:balance}
.page-head p{margin:6px 0 0;color:var(--muted);font-size:13.5px;max-width:820px}
.page-head .actions{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.section-label{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:20px 0 9px}
.muted{color:var(--muted)}.strong{font-weight:600;color:var(--navy)}.nowrap{white-space:nowrap}
.aid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);white-space:nowrap}
.mcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:-.2px}
.mcode i{font-style:normal;color:var(--accent);opacity:.8}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:9px;padding:9px 15px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;color:var(--navy);background:#EDF1F6;cursor:pointer;white-space:nowrap;transition:.12s}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.dark{background:var(--navy);color:#fff}
.btn.good{background:var(--ok);color:#fff}
.btn.danger{background:#fff;border:1px solid #EBC7C0;color:var(--danger)}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--steel)}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn[disabled]{opacity:.42;cursor:not-allowed;pointer-events:none}
.btn:active{transform:translateY(1px)}
.lnk{border:0;background:none;color:var(--blue);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:2px 0}
.lnk:hover{text-decoration:underline}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hd{padding:13px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .hd h3{margin:0;font-size:14.5px;color:var(--navy);font-weight:700}
.card .hd .tag{margin-left:auto;font-size:11px;color:var(--muted)}
.card .bd{padding:16px 17px}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px 12px;box-shadow:var(--shadow)}
.kpi .num{font-size:31px;font-weight:800;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.kpi .lab{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.35}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
.kpi.hot{border-color:#EBC7C0;background:#FEF8F7}.kpi.hot .num{color:var(--danger)}
.kpi.warn{border-color:#EFD9AC;background:#FEFBF3}.kpi.warn .num{color:var(--warn)}
.kpi.good .num{color:var(--ok)}
.kpi.review .num{color:var(--review)}
.kpi.lead{background:linear-gradient(135deg,var(--navy),var(--blue));border-color:transparent}
.kpi.lead .num{color:#fff;font-size:36px}
.kpi.lead .lab{color:#C6D7EE}
.kpi.lead .sub{color:#A5BEE3;border-top-color:rgba(255,255,255,.18)}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.chip.plain::before{display:none}
.s-prog{background:#FFF2E0;color:#A66A12}
.s-done{background:#E6F4EC;color:#1B8A57}
.s-delay{background:#FBEBE8;color:#BF3B2B}
.s-review{background:#F3EAF8;color:#7D3C98}
.s-open{background:#EAF1F9;color:#2E5FA3}
.s-resp{background:#E8F1FB;color:#2E5FA3}
.m-draft{background:#EDF1F6;color:#64707F}
.m-appr{background:#FFF2E0;color:#A66A12}
.m-live{background:#FBEBE8;color:#BF3B2B}
.p-vh{background:#F9E3E0;color:#9E2B1D}.p-h{background:#FBEBE8;color:#BF3B2B}
.p-m{background:#FFF2E0;color:#A66A12}.p-l{background:#EAF1F9;color:#2E5FA3}.p-ll{background:#EDF1F6;color:#64707F}
.ptag{background:var(--ice);color:var(--navy);border:1px solid var(--ice2);font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;display:inline-block}
.tpill{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:5px;white-space:nowrap}
.tpill.instant{background:#FBEBE8;color:#9E2B1D}
.tpill.sched{background:#EAF1F9;color:#2E5FA3}
.tpill.act{background:#EAF1F9;color:#2E5FA3}
.tpill.cla{background:#F3EAF8;color:#7D3C98}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);padding:11px 12px;border-bottom:1px solid var(--line);background:#F9FBFD;white-space:nowrap;font-weight:700}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:#F6F9FC}
tbody tr.sel{background:#EAF1F9}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- layout ---------- */
.cols{display:grid;gap:16px}
.c-2{grid-template-columns:1fr 1fr}
.c-3{grid-template-columns:1fr 1fr 1fr}
.c-32{grid-template-columns:1.7fr 1fr}
.c-23{grid-template-columns:1fr 1.7fr}
.flex{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
@media (max-width:1240px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1080px){.c-2,.c-32,.c-23{grid-template-columns:1fr}.c-3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){.app{grid-template-columns:1fr}.sidebar{display:none}.c-3{grid-template-columns:1fr}}

/* ---------- forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--navy);margin-bottom:5px}
.field label .req{color:var(--danger);margin-left:2px}
.field .hint{font-weight:400;color:var(--muted);font-size:11px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--sans);font-size:13px;background:#fff;color:var(--ink);min-height:38px}
textarea.i{min-height:64px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--steel);box-shadow:0 0 0 3px rgba(46,95,163,.13)}
input.i.bad,select.i.bad,textarea.i.bad{border-color:#D98C7F;background:#FEF8F7}
.err{color:var(--danger);font-size:11.5px;font-weight:600;margin-top:4px;display:none}
.err.on{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:820px){.row2,.row3,.row4{grid-template-columns:1fr}}
.tokens{display:flex;flex-wrap:wrap;gap:7px}
.token{background:var(--ice);border:1px solid var(--ice2);color:var(--navy);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.token .x{color:var(--muted);cursor:pointer;font-weight:800;line-height:1}
.token .x:hover{color:var(--danger)}
.check{width:16px;height:16px;border:1.5px solid #B9C6D6;border-radius:4px;flex:0 0 auto;background:#fff;display:grid;place-items:center;cursor:pointer}
.check.on{background:var(--blue);border-color:var(--blue)}
.opt{display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;padding:3px 0}

/* multi-select officers */
.ms{border:1px solid var(--line);border-radius:9px;background:#fff;padding:7px 8px;min-height:38px}
.ms.bad{border-color:#D98C7F}
.ms-list{max-height:184px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;margin-top:8px;background:#fff}
.ms-row{display:flex;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.ms-row:last-child{border-bottom:0}
.ms-row:hover{background:#F6F9FC}
.ms-row .av{width:24px;height:24px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;flex:0 0 auto}
.ms-row small{color:var(--muted);font-size:11px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs .t{padding:10px 16px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;background:none;border-top:0;border-left:0;border-right:0}
.tabs .t:hover{color:var(--navy)}
.tabs .t.on{color:var(--navy);border-bottom-color:var(--accent)}
.tabs .t .cnt{background:#EDF1F6;color:var(--muted);border-radius:20px;padding:1px 7px;font-size:10.5px;font-weight:800}
.tabs .t.on .cnt{background:var(--ice);color:var(--blue)}

/* ---------- stepper / wizard ---------- */
.stepper{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.stp{flex:1;padding:12px 8px 11px;text-align:center;border-bottom:3px solid transparent;min-width:104px}
.stp .n{width:26px;height:26px;border-radius:50%;background:#EDF1F6;color:var(--muted);display:inline-grid;place-items:center;font-weight:800;font-size:12px;margin-bottom:5px}
.stp .t{font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.3}
.stp.done .n{background:var(--ok);color:#fff}.stp.done .t{color:var(--ok)}
.stp.now{border-bottom-color:var(--accent)}.stp.now .n{background:var(--accent);color:#fff}.stp.now .t{color:var(--accent-d)}

/* ---------- hero ---------- */
.mhero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:var(--radius);padding:19px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.mhero .code{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#A5BEE3;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mhero h2{margin:6px 0 4px;font-size:20px;color:#fff;line-height:1.3;font-family:var(--serif);font-weight:600}
.mhero .facts{display:flex;flex-wrap:wrap;gap:22px;font-size:12.5px;color:#D2DFF3;margin-top:12px}
.mhero .facts b{color:#fff;display:block;font-size:12.5px;font-weight:600}
.mhero .facts span{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:#93ABD6;display:block;margin-bottom:2px}

/* ---------- notices ---------- */
.notice{display:flex;gap:11px;align-items:flex-start;background:var(--ice);border:1px solid var(--ice2);border-radius:10px;padding:11px 14px;font-size:12.5px;margin-bottom:13px}
.notice.amber{background:#FEF7EC;border-color:#EFD9AC}
.notice.red{background:#FDF3F1;border-color:#EBC7C0}
.notice.green{background:#F1FAF5;border-color:#BEE3CF}
.notice.violet{background:#F7F0FA;border-color:#DFC9EA}
.notice b{color:var(--navy)}
.notice .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:0 0 auto;margin-top:5px}
.notice.amber .dot{background:var(--warn)}.notice.red .dot{background:var(--danger)}
.notice.green .dot{background:var(--ok)}.notice.violet .dot{background:var(--review)}
.pending{display:inline-flex;align-items:center;gap:6px;background:#FFF4E2;border:1px dashed #E0B978;color:#8A5F0B;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}

/* ---------- people rows ---------- */
.att{display:flex;flex-direction:column;gap:7px}
.att .r{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;flex-wrap:wrap}
.att .r .av{width:31px;height:31px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex:0 0 auto}
.att .r .nm b{font-size:12.5px;display:block;line-height:1.25}
.att .r .nm small{color:var(--muted);font-size:10.5px}
.att .r .st{margin-left:auto;display:flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--muted);font:inherit;font-size:11.5px;font-weight:600;padding:6px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{color:#fff}
.seg button.on.p{background:var(--ok)}
.seg button.on.v{background:var(--blue)}
.seg button.on.a{background:var(--danger)}

/* ---------- rich text ---------- */
.rte-bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:#F9FBFD;padding:7px}
.rte-bar button{border:1px solid transparent;background:none;border-radius:7px;min-width:30px;height:30px;font-size:13px;color:var(--navy);font-weight:700;padding:0 9px;cursor:pointer}
.rte-bar button:hover{background:var(--ice);border-color:var(--ice2)}
.rte-bar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.rte{border:1px solid var(--line);border-radius:0 0 10px 10px;background:#fff;min-height:260px;padding:18px 20px;font-size:13.5px;line-height:1.75;outline:none}
.rte:focus{border-color:var(--steel);box-shadow:0 0 0 3px rgba(46,95,163,.13)}
.rte h3{color:var(--navy);font-size:15px;margin:0 0 8px}
.rte mark{background:#FFE9A8}

/* ---------- item rows ---------- */
.arow{border:1px solid var(--line);border-radius:10px;background:#fff;padding:13px 15px;margin-bottom:9px}
.arow.act{border-left:3px solid var(--blue)}
.arow.cla{border-left:3px solid var(--review)}
.arow .ah{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.arow .atask{flex:1;min-width:240px}
.arow .atask b{font-size:13px;color:var(--navy);font-weight:600;display:block;line-height:1.45}
.arow .ameta{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.arow .abtns{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.arow .rem{margin-top:8px;background:var(--ice);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:8px 11px;font-size:12px}
.arow .rem b{color:var(--navy);text-transform:uppercase;font-size:9.5px;letter-spacing:1.2px;display:block;margin-bottom:2px}
.owners{display:inline-flex;align-items:center;gap:-6px}
.owners .av{width:22px;height:22px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700;border:2px solid #fff;margin-right:-6px}

/* ---------- filters ---------- */
.filtbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin-bottom:13px;box-shadow:var(--shadow)}
.filtbar .fgrp{display:flex;flex-direction:column;gap:5px;flex:1;min-width:150px}
.filtbar .fgrp label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:700}
.filtbar select.i,.filtbar input.i{padding:8px 10px;font-size:12.5px;min-height:34px}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-head h4{margin:0;font-family:var(--serif);font-size:16px;color:var(--navy);min-width:168px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .dow{background:#F9FBFD;padding:8px 6px;text-align:center;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:800}
.cal .day{background:#fff;min-height:88px;padding:6px 7px;display:flex;flex-direction:column;gap:4px}
.cal .day.out{background:#FAFBFD}
.cal .day.out .dn{color:#C3CCD8}
.cal .day.today{background:#FFFBF4}
.cal .dn{font-size:11.5px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.cal .day.today .dn{background:var(--accent);color:#fff;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.cal .ev{border-radius:5px;padding:3px 6px;font-size:10.5px;font-weight:600;line-height:1.3;cursor:pointer;border-left:3px solid;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev:hover{filter:brightness(.96)}
.ev.done{background:#E6F4EC;color:#136B43;border-color:#1B8A57}
.ev.up{background:#EAF1F9;color:#22497D;border-color:#2E5FA3}
.ev.draft{background:#EDF1F6;color:#5A6472;border-color:#98A5B4}
.ev.inst{background:#FBEBE8;color:#9E2B1D;border-color:#BF3B2B}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* ---------- donut ---------- */
.pieflex{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.pleg{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.plr{display:grid;grid-template-columns:14px 1fr auto 44px;gap:9px;align-items:center;font-size:12.5px}
.plr .sw{width:12px;height:12px;border-radius:4px}
.plr b{font-variant-numeric:tabular-nums;color:var(--navy)}
.plr .pp{color:var(--muted);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}

/* bars */
.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:11px;align-items:center;font-size:12px}
.bar .track{background:#EDF1F6;border-radius:6px;height:13px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar b{font-variant-numeric:tabular-nums;color:var(--navy);text-align:right}

/* ---------- files ---------- */
.drop{border:1.5px dashed #B9C6D6;border-radius:12px;background:#F9FBFD;padding:24px;text-align:center}
.drop.bad{border-color:#D98C7F;background:#FEF8F7}
.drop b{display:block;color:var(--navy);font-size:13.5px;margin:9px 0 3px}
.drop small{color:var(--muted);font-size:11.5px}
.filerow{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}
.filerow .ic{width:32px;height:38px;border-radius:5px;background:#FBEBE8;color:var(--danger);display:grid;place-items:center;font-size:9px;font-weight:800;flex:0 0 auto}
.filerow .ic.x{background:#E6F4EC;color:#1B8A57}
.filerow .ic.i{background:#EAF1F9;color:#2E5FA3}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column}
.tl .e{display:flex;gap:13px}
.tl .rail{display:flex;flex-direction:column;align-items:center;width:26px;flex:0 0 auto}
.tl .bub{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ice);color:var(--navy);font-size:11px;font-weight:800}
.tl .bub.ok{background:var(--ok);color:#fff}
.tl .bub.now{background:var(--accent);color:#fff}
.tl .bub.wait{background:#EDF1F6;color:#98A5B4}
.tl .stem{width:2px;flex:1;background:var(--ice2);min-height:14px}
.tl .e:last-child .stem{display:none}
.tl .body{padding:2px 0 15px;flex:1}
.tl .body b{color:var(--navy);font-size:12.5px;font-weight:600}
.tl .body .who{font-size:11px;color:var(--muted);margin-top:2px}

/* ---------- modal / drawer / toast ---------- */
.mask{position:fixed;inset:0;background:rgba(19,35,61,.5);display:flex;align-items:flex-start;justify-content:center;padding:56px 20px 20px;z-index:60;overflow-y:auto}
.mask[hidden]{display:none}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;box-shadow:0 24px 60px rgba(13,30,56,.35);margin-bottom:40px}
.modal.wide{max-width:900px}
.modal .m-hd{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;z-index:2}
.modal .m-hd h3{margin:0;font-size:15px;color:var(--navy)}
.modal .m-hd .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;border:0;background:none}
.modal .m-bd{padding:18px 20px}
.modal .m-ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.m-note{font-size:11.5px;color:var(--muted);background:var(--ice);border-radius:8px;padding:9px 11px;margin-bottom:14px}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,96vw);background:#fff;border-left:1px solid var(--line);box-shadow:-18px 0 46px rgba(13,30,56,.18);display:flex;flex-direction:column;z-index:70}
.drawer[hidden]{display:none}
.drawer .d-hd{padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .d-bd{padding:18px 20px;flex:1;overflow-y:auto}
.drawer .d-ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:#F9FBFD;flex-wrap:wrap}

.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:9px;z-index:90}
.toast{background:var(--navy);color:#fff;padding:11px 15px;border-radius:10px;box-shadow:0 12px 30px rgba(13,30,56,.32);font-size:12.5px;display:flex;align-items:center;gap:9px;max-width:380px;animation:tin .22s ease}
.toast .dotk{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.toast.ok .dotk{background:#43D98A}
.toast.bad{background:#8A2418}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* ---------- guide ---------- */
.guide{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 17px;margin-top:22px;box-shadow:var(--shadow)}
.guide .gh{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:6px}
.guide h4{margin:0 0 6px;font-size:13.5px;color:var(--navy)}
.guide p{margin:0 0 6px;font-size:12.5px;color:var(--muted);line-height:1.7;max-width:940px}
.guide p:last-child{margin-bottom:0}
.guide b{color:var(--ink);font-weight:600}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px;background:linear-gradient(160deg,#142640 0%,#1D3557 55%,#2E5FA3 130%);overflow-y:auto}
.rolegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:1100px){.rolegrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:840px){.rolegrid{grid-template-columns:repeat(2,1fr)}}
.rolecard{background:#fff;border:0;border-radius:14px;padding:15px 16px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:flex-start;box-shadow:0 6px 20px rgba(0,0,0,.18);font:inherit;transition:.15s;min-height:118px}
.rolecard:hover{transform:translateY(-3px)}
.rolecard .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:0 0 auto}
.rolecard b{display:block;font-size:13.5px;color:var(--navy);line-height:1.3}
.rolecard small{color:var(--muted);font-size:11.5px;line-height:1.45;display:block;margin-top:3px}
.rolecard .tagline{display:inline-block;margin-top:7px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}

/* matrix */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:800}
.no{color:#C3CCD8;font-weight:700}

/* ---------- A4 MoM document ---------- */
.doc-wrap{overflow-x:auto;background:#E4E9F1;padding:18px;border-radius:0 0 var(--radius) var(--radius)}
.doc{position:relative;width:794px;min-height:1123px;margin:0 auto;background:#fff;

.doc-wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0;overflow:hidden}
.doc-wm span{font-family:var(--serif);font-size:104px;font-weight:700;color:rgba(191,59,43,.11);letter-spacing:16px;
  transform:rotate(-30deg);white-space:nowrap;border:7px solid rgba(191,59,43,.11);padding:14px 44px 14px 60px;border-radius:14px}
.doc-wm.ok span{color:rgba(27,138,87,.12);border-color:rgba(27,138,87,.12);font-size:74px;letter-spacing:10px;padding:14px 40px 14px 50px}
.doc > *:not(.doc-wm){position:relative;z-index:1}
.doc-hd{display:flex;gap:16px;align-items:flex-start;border-bottom:2.5px solid var(--navy);padding-bottom:14px}
.doc-hd .seal{width:54px;height:54px;border-radius:11px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.doc-hd .t{flex:1;text-align:center;padding-top:2px}
.doc-hd .t .o{font-size:9.5px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:700}
.doc-hd .t h1{font-family:var(--serif);font-size:19px;color:var(--navy);margin:4px 0 3px;font-weight:700;letter-spacing:.2px}
.doc-hd .t .s{font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--accent-d);font-weight:800}
.doc-hd .r{text-align:right;font-size:9.5px;color:var(--muted);line-height:1.8;min-width:142px}
.doc-hd .r b{display:block;color:var(--navy);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:-.2px}
.doc-meta{width:100%;border-collapse:collapse;margin:16px 0 4px;font-size:11px}
.doc-meta th{width:104px;text-align:left;background:#F3F6FA;color:var(--navy);font-size:9px;letter-spacing:.9px;
  text-transform:uppercase;padding:7px 9px;border:1px solid #D6DFEA;font-weight:800;white-space:nowrap;vertical-align:top}
.doc-meta td{padding:7px 9px;border:1px solid #D6DFEA;color:#22303F}
.doc h4{font-family:var(--serif);font-size:12.5px;color:var(--navy);margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid #D6DFEA;font-weight:700}
.doc p{margin:0 0 8px}
.doc .mins h3{font-family:var(--serif);font-size:12px;color:var(--navy);margin:12px 0 5px}
.doc .mins mark{background:#FFF0B8}
.doc .mins ol,.doc .mins ul{margin:0 0 8px;padding-left:20px}
.doc-tbl{width:100%;border-collapse:collapse;font-size:10px}
.doc-tbl th{background:#F3F6FA;border:1px solid #D6DFEA;padding:6px 7px;text-align:left;font-size:8.5px;
  letter-spacing:.6px;text-transform:uppercase;color:var(--navy);font-weight:800}
.doc-tbl td{border:1px solid #D6DFEA;padding:6px 7px;vertical-align:top;line-height:1.5}
.doc-tbl .n{text-align:center;width:26px;color:var(--muted)}
.doc-note{background:#F7F9FC;border-left:3px solid var(--steel);padding:8px 11px;font-size:10px;color:#4A5A6C;margin:10px 0 0}
.doc-sign{margin-top:36px;display:flex;justify-content:space-between;gap:30px;font-size:10.5px;color:var(--muted)}
.doc-sign .box{text-align:center;flex:0 0 232px}
.doc-sign .line{border-bottom:1px solid #9AA6B4;height:46px;margin-bottom:6px}
.doc-sign b{color:var(--navy);display:block;font-size:11px}
.doc-ft{margin-top:26px;border-top:1px solid #D6DFEA;padding-top:8px;display:flex;justify-content:space-between;
  font-size:8.5px;color:#8A97A6;letter-spacing:.3px}

#printArea{display:none}
@media print{
  html,body{overflow:visible;background:#fff;height:auto}
  .app,.mask,.drawer,.toasts{display:none!important}
  #printArea{display:block}
  .doc-wrap{padding:0;background:none;overflow:visible}
  .doc{box-shadow:none;margin:0;width:auto;min-height:auto;padding:0}
  .doc-wm{position:fixed;inset:0}
  .doc-wm span,.doc-meta th,.doc-tbl th,.doc-note{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc h4,.doc-tbl tr{break-inside:avoid}
  @page{size:A4;margin:14mm}
}

</style>

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

}

var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function d(iso) { var p = String(iso).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function fmt(iso) { if (!iso) return '—'; var x = d(iso); return x.getDate() + ' ' + MON[x.getMonth()] + ' ' + x.getFullYear(); }
function fmtShort(iso) { if (!iso) return '—'; var x = d(iso); return x.getDate() + ' ' + MON[x.getMonth()]; }
function days(a, b) { return Math.round((d(b) - d(a)) / 86400000); }
function isPast(iso) { return days(iso, TODAY) > 0; }

/** Human ageing label for a register item. */
function ageing(it) {
  if (it.type === 'clarification') {
    if (it.status === 'Closed') return 'closed';
    var raisedOn = it.hist && it.hist.length ? it.hist[0][0].slice(0, 10) : TODAY;
    return days(raisedOn, TODAY) + ' days open';
  }
  if (it.status === 'Completed') return 'closed';
  var late = days(it.due, TODAY);
  if (late > 0) return late + ' day' + (late === 1 ? '' : 's') + ' late';
  if (late === 0) return 'due today';
  return 'due in ' + (-late) + ' day' + (late === -1 ? '' : 's');
}

/* ---------- charts ---------- */
function arcPath(cx, cy, r, a0, a1) {
  var large = (a1 - a0) > Math.PI ? 1 : 0;
  var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
  var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
  return 'M' + cx + ' ' + cy + ' L' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z';
}
/** data = [[label, value, colour], ...] */
function donut(data, size) {
  var total = data.reduce(function (s, x) { return s + x[1]; }, 0);
  var sz = size || 158;
  if (!total) return '<svg viewBox="0 0 150 150" width="' + sz + '" height="' + sz + '"><circle cx="75" cy="75" r="55" fill="#EDF1F6"/><circle cx="75" cy="75" r="31" fill="#fff"/></svg>';
  var nz = data.filter(function (x) { return x[1] > 0; });
  var out = '';
  if (nz.length === 1) {
    out = '<circle cx="75" cy="75" r="55" fill="' + nz[0][2] + '"><title>' + esc(nz[0][0]) + ': ' + nz[0][1] + ' (100%)</title></circle>';
  } else {
    var a = -Math.PI / 2;
    nz.forEach(function (x) {
      var a1 = a + x[1] / total * 2 * Math.PI;
      out += '<path d="' + arcPath(75, 75, 55, a, a1) + '" fill="' + x[2] + '" stroke="#fff" stroke-width="2"><title>' +
        esc(x[0]) + ': ' + x[1] + ' — ' + Math.round(x[1] * 100 / total) + '%</title></path>';
      a = a1;
    });
  }
  return '<svg viewBox="0 0 150 150" width="' + sz + '" height="' + sz + '" role="img" style="flex:0 0 auto">' + out +
    '<circle cx="75" cy="75" r="31" fill="#fff"/>' +
    '<text x="75" y="72" text-anchor="middle" font-size="21" font-weight="800" fill="#1D3557" font-family="Public Sans,sans-serif">' + total + '</text>' +
    '<text x="75" y="87" text-anchor="middle" font-size="8.5" fill="#64707F" font-family="Public Sans,sans-serif" letter-spacing="1">TOTAL</text></svg>';
}
function donutLegend(data) {
  var total = data.reduce(function (s, x) { return s + x[1]; }, 0) || 1;
  return '<div class="pleg">' + data.map(function (x) {
    return '<div class="plr"><span class="sw" style="background:' + x[2] + '"></span><span>' + esc(x[0]) +
      '</span><b>' + x[1] + '</b><span class="pp">' + Math.round(x[1] * 100 / total) + '%</span></div>';
  }).join('') + '</div>';
}

/* ---------- calendar ---------- */
function calendarCard(meets) {
  var ym = STATE.calMonth.split('-'), y = +ym[0], mo = +ym[1] - 1;
  var first = new Date(y, mo, 1);
  var startDow = (first.getDay() + 6) % 7;           /* Monday-first */
  var dim = new Date(y, mo + 1, 0).getDate();
  var prevDim = new Date(y, mo, 0).getDate();

  var byDate = {};
  meets.forEach(function (m) { (byDate[m.date] = byDate[m.date] || []).push(m); });

  var cells = '';
  for (var i = 0; i < 7; i++) cells += '<div class="dow">' + DOW[i] + '</div>';

  function dayCell(dayNum, mm, yy, out) {
    var iso = yy + '-' + String(mm + 1).padStart(2, '0') + '-' + String(dayNum).padStart(2, '0');
    var evs = (byDate[iso] || []).map(function (m) {
      var cls = m.type === 'instant' ? 'inst' : (m.stage >= 6 ? 'done' : (m.stage >= 5 ? 'up' : 'draft'));
      return '<div class="ev ' + cls + '" data-act="open-meeting" data-id="' + m.id + '" title="' + esc(m.code.join('/') + ' — ' + m.title) + '">' +
        esc(m.start) + ' ' + esc(m.title) + '</div>';
    }).join('');
    return '<div class="day' + (out ? ' out' : '') + (iso === TODAY ? ' today' : '') + '">' +
      '<span class="dn">' + dayNum + '</span>' + evs + '</div>';
  }

  for (var p = startDow; p > 0; p--) cells += dayCell(prevDim - p + 1, mo === 0 ? 11 : mo - 1, mo === 0 ? y - 1 : y, true);
  for (var dnum = 1; dnum <= dim; dnum++) cells += dayCell(dnum, mo, y, false);
  var tail = (7 - ((startDow + dim) % 7)) % 7;
  for (var t = 1; t <= tail; t++) cells += dayCell(t, mo === 11 ? 0 : mo + 1, mo === 11 ? y + 1 : y, true);

  var up = meets.filter(function (m) { return m.date >= TODAY; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; }).slice(0, 4);
  var rec = meets.filter(function (m) { return m.date < TODAY; }).sort(function (a, b) { return a.date > b.date ? -1 : 1; }).slice(0, 4);

  function miniList(list, none) {
    if (!list.length) return '<div class="empty" style="padding:16px">' + none + '</div>';
    return list.map(function (m) {
      return '<div class="flex" data-act="open-meeting" data-id="' + m.id + '" style="gap:11px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer">' +
        '<div style="text-align:center;min-width:38px"><div style="font-size:16px;font-weight:800;color:var(--navy);line-height:1">' + d(m.date).getDate() + '</div>' +
        '<div style="font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)">' + MON[d(m.date).getMonth()] + '</div></div>' +
        '<div style="flex:1;min-width:0"><b style="font-size:12.5px;color:var(--navy);display:block">' + esc(m.title) + '</b>' +
        '<span class="muted" style="font-size:11px">' + esc(m.start) + ' · ' + esc(m.cat) + '</span></div>' +
        '<span class="tpill ' + (m.type === 'instant' ? 'instant">Instant' : 'sched">Scheduled') + '</span></div>';
    }).join('');
  }

  return '<div class="card"><div class="hd">' +
    '<h3>Meeting calendar</h3>' +
    '<span class="tag">click any meeting to open it</span>' +
    '</div><div class="bd">' +
    '<div class="cal-head">' +
      '<button class="btn sm ghost" data-act="cal" data-dir="-1">' + ic('left', 14) + '</button>' +
      '<h4>' + MONL[mo] + ' ' + y + '</h4>' +
      '<button class="btn sm ghost" data-act="cal" data-dir="1">' + ic('right', 14) + '</button>' +
      '<button class="btn sm ghost" data-act="cal" data-dir="0">Today</button>' +
      '<span class="muted" style="margin-left:auto;font-size:11.5px">' + meets.length + ' meetings in scope</span>' +
    '</div>' +
    '<div class="cal">' + cells + '</div>' +
    '<div class="leg">' +
      '<span><i style="background:#1B8A57"></i>Conducted</span>' +
      '<span><i style="background:#2E5FA3"></i>Confirmed &amp; upcoming</span>' +
      '<span><i style="background:#98A5B4"></i>Still being planned</span>' +
      '<span><i style="background:#BF3B2B"></i>Instant meeting</span>' +
    '</div>' +
    '<div class="cols c-2" style="margin-top:18px">' +
      '<div><div class="section-label" style="margin-top:0">Pipeline</div>' + miniList(up, 'Nothing scheduled ahead.') + '</div>' +
      '<div><div class="section-label" style="margin-top:0">Recently held</div>' + miniList(rec, 'No past meetings.') + '</div>' +
    '</div></div></div>';
}

/* ---------- attention ---------- */

    });
  }
  if (can('confirm_completion')) {
    items.forEach(function (it) {
      if (it.type === 'action' && it.status === 'Under Review') out.push(['violet', '<b>' + it.id + '</b> — ' + esc(it.desc) + ' — reported complete, awaiting your confirmation', 'Review', 'open-item', it.id, '']);
    });
  }
  if (can('confirm_meeting')) {
    MEETINGS.forEach(function (m) {
      if (m.type === 'scheduled' && m.stage === 4 && inScopeMeeting(m)) out.push(['amber', 'Invitees are still adding to <b>' + esc(m.title) + '</b>. Agenda freezes ' + esc(m.freeze) + ' — confirm the meeting after that.', 'Open', 'open-meeting', m.id, 'agenda']);
      if (m.type === 'scheduled' && m.stage === 1 && inScopeMeeting(m)) out.push(['', '<b>' + esc(m.title) + '</b> is still a draft — no agenda, no invitees yet.', 'Continue', 'open-meeting', m.id, 'agenda']);
    });
  }
  items.forEach(function (it) {
    if (it.type === 'action' && it.status === 'Delayed' && (ownsItem(it) || can('confirm_completion') || can('confirm_meeting')))
      out.push(['red', '<b>' + it.id + '</b> is ' + ageing(it) + ' — ' + esc(it.desc), 'Open', 'open-item', it.id, '']);
    if (it.type === 'clarification' && it.status === 'Open' && (it.respBy === me.id || can('respond_clarification')))
      out.push(['', '<b>' + it.id + '</b> is unanswered — ' + esc(it.desc), 'Respond', 'open-item', it.id, '']);
    if (it.type === 'action' && ownsItem(it) && (it.status === 'In Progress'))
      out.push(['', '<b>' + it.id + '</b> is assigned to you · ' + ageing(it), 'Update', 'open-item', it.id, '']);
  });

  if (!out.length) out.push(['green', 'Nothing is pending with you right now. Browse the calendar, the register or the project master from the left.', '', '', '', '']);

  return '<div class="card"><div class="hd"><h3>Needs your attention</h3><span class="tag">changes with the signed-in designation</span></div><div class="bd">' +
    out.slice(0, 8).map(function (o) {
      return '<div class="notice ' + o[0] + '"><span class="dot"></span><span style="flex:1">' + o[1] + '</span>' +
        (o[2] ? '<button class="btn sm ghost" data-act="' + o[3] + '" data-id="' + o[4] + '"' + (o[5] ? ' data-tab="' + o[5] + '"' : '') + '>' + o[2] + '</button>' : '') + '</div>';
    }).join('') +
    (out.length > 8 ? '<div class="muted" style="font-size:11.5px">+ ' + (out.length - 8) + ' more</div>' : '') +
    '</div></div>';
}

function inScopeMeeting(m) {
  if (seesAll()) return true;
  for (var i = 0; i < m.prj.length; i++) if (inScope(m.prj[i])) return true;
  return false;
}

function momChip(s) {
  var map = { none: ['m-draft', '—'], draft: ['m-draft', 'Draft'], submitted: ['s-review', 'Awaiting approval'],
    returned: ['s-delay', 'Returned'], approved: ['s-open', 'Approved'], signed: ['s-done', 'Signed'] };
  var x = map[s] || map.none;
  return '<span class="chip ' + x[0] + '">' + x[1] + '</span>';
}
function meetingItems(id) { return ITEMS.filter(function (i) { return i.m === id; }); }

/* ---------------------------------------------------------------- list */
function viewMeetings() {
  var f = STATE.mf;
  var list = visibleMeetings().filter(function (m) {
    if (f.type && m.type !== f.type) return false;
    if (f.cat && m.cat !== f.cat) return false;
    if (f.prj && m.prj.indexOf(f.prj) < 0) return false;
    if (f.q) {
      var hay = (mcodeText(m) + ' ' + m.title + ' ' + u(m.chair).name).toLowerCase();
      if (hay.indexOf(f.q.toLowerCase()) < 0) return false;
    }
    return true;
  }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });

  var rows = list.map(function (m) {
    var its = meetingItems(m.id);
    var acts = its.filter(function (i) { return i.type === 'action'; });
    var open = acts.filter(function (i) { return i.status !== 'Completed'; }).length;
    var clas = its.filter(function (i) { return i.type === 'clarification'; }).length;
    return '<tr class="clickable" data-act="open-meeting" data-id="' + m.id + '">' +
      '<td><span class="mcode">' + mcode(m) + '</span></td>' +
      '<td><span class="tpill ' + (m.type === 'instant' ? 'instant">Instant' : 'sched">Scheduled') + '</span></td>' +
      '<td><span class="strong" style="font-size:13px">' + esc(m.title) + '</span>' +
        '<div class="muted" style="font-size:11px;margin-top:2px">' + esc(m.cat) + ' · ' + m.prj.map(function (p) { return prj(p).name; }).join(', ') + '</div></td>' +
      '<td class="nowrap">' + fmt(m.date) + '<div class="muted" style="font-size:11px">' + esc(m.start) + '–' + esc(m.end) + '</div></td>' +
      '<td>' + esc(u(m.chair).name) + '</td>' +
      '<td>' + (acts.length ? '<b style="color:var(--blue);font-size:13px">' + acts.length + '</b>' : '<span class="muted">—</span>') + '</td>' +
      '<td>' + (open ? '<span class="chip s-prog">' + open + '</span>' : (acts.length ? '<span class="chip s-done">0</span>' : '<span class="muted">—</span>')) + '</td>' +
      '<td>' + (clas ? '<b style="color:var(--review);font-size:13px">' + clas + '</b>' : '<span class="muted">—</span>') + '</td>' +
      '<td>' + momChip(m.momState) + '</td>' +
      '<td>' + meetingStageChip(m) + '</td>' +
      '<td class="nowrap"><span class="lnk">Open →</span></td></tr>';
  }).join('') || emptyRow(11, 'No meetings match these filters.');

  var mayCreate = can('plan_instant') || can('plan_scheduled');

  return '<div class="page-head"><div><div class="eyebrow">Meetings</div><h2>All meetings</h2>' +
      '<p>The meeting is the unit of record. Two ways in: an <b>instant meeting</b> the coordinator runs end to end in one sitting, or a <b>scheduled meeting</b> that circulates its agenda for invitees to add to before it is confirmed.</p></div>' +
      '<div class="actions"><button class="btn ghost">Export register</button>' +
      '<button class="btn primary" data-act="new-meeting"' + (mayCreate ? '' : ' disabled title="Your designation cannot create meetings"') + '>+ New meeting</button></div></div>' +
    (mayCreate ? '' : '<div class="notice"><span class="dot"></span><span>Only the <b>Meeting Coordinator</b> and <b>PDMC</b> designations can create meetings. Switch role in the top bar to try it.</span></div>') +
    '<div class="filtbar">' +
      '<div class="fgrp"><label>Type</label>' + sel('mfType', [{ v: '', l: 'Instant and scheduled' }, { v: 'instant', l: 'Instant only' }, { v: 'scheduled', l: 'Scheduled only' }], f.type, ' data-mf="type"') + '</div>' +
      '<div class="fgrp"><label>Category</label>' + sel('mfCat', [{ v: '', l: 'All categories' }].concat(CATEGORIES), f.cat, ' data-mf="cat"') + '</div>' +
      '<div class="fgrp"><label>Project</label>' + sel('mfPrj', [{ v: '', l: 'All projects' }].concat(myProjects().map(function (p) { return { v: p, l: prj(p).name + ' — ' + prj(p).full }; })), f.prj, ' data-mf="prj"') + '</div>' +
      '<div class="fgrp" style="flex:1.5"><label>Search</label><input class="i" id="mfQ" data-mf="q" placeholder="Meeting code, title or chair…" value="' + esc(f.q) + '"></div>' +
    '</div>' +
    '<div class="card" style="overflow-x:auto"><table>' +
      '<thead><tr><th style="width:104px">Code</th><th style="width:88px">Type</th><th>Meeting</th><th style="width:104px">Date</th>' +
      '<th style="width:104px">Chair</th><th style="width:66px">Actions</th><th style="width:60px">Open</th><th style="width:74px">Clarif.</th>' +
      '<th style="width:132px">MoM</th><th style="width:158px">Stage</th><th style="width:66px"></th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>' +
    guide('Two journeys, one register', [
      'Whichever way a meeting is created, everything downstream is identical — attendance, minutes, actions and clarifications, MoM, signed copy, circulation. The difference is only in how the meeting comes into being.',
      'An <b>instant meeting</b> skips agenda circulation because there is no time for it; it is marked as instant everywhere so a reviewer can always tell that the agenda was not seen in advance.'
    ]);
}

/* ---------------------------------------------------------------- chooser */
function chooseMeetingType() {
  var canI = can('plan_instant'), canS = can('plan_scheduled');
  function card(kind, title, when, steps, on) {
    return '<div class="card" style="cursor:' + (on ? 'pointer' : 'not-allowed') + ';opacity:' + (on ? 1 : .5) + '"' +
      (on ? ' data-act="start-meeting" data-kind="' + kind + '"' : '') + '>' +
      '<div class="bd">' +
        '<div class="flex" style="gap:10px;margin-bottom:8px"><span class="tpill ' + (kind === 'instant' ? 'instant">Instant' : 'sched">Scheduled') + '</span>' +
        '<b style="font-family:var(--serif);font-size:16px;color:var(--navy)">' + title + '</b></div>' +
        '<p class="muted" style="font-size:12.5px;margin:0 0 12px">' + when + '</p>' +
        '<div class="tl">' + steps.map(function (s, i) {
          return '<div class="e"><div class="rail"><div class="bub' + (i === 0 ? ' now' : ' wait') + '">' + (i + 1) + '</div><div class="stem"></div></div>' +
            '<div class="body"><b>' + s[0] + '</b><div class="who">' + s[1] + '</div></div></div>';
        }).join('') + '</div>' +
      '</div></div>';
  }
  openModal(
    '<div class="m-hd"><h3>New meeting</h3><button class="x" data-act="close-modal">×</button></div>' +
    '<div class="m-bd"><div class="m-note">The two types differ only in how the meeting is set up. Once it is held, both follow the same path: attendance → minutes → actions and clarifications → MoM → signed and circulated.</div>' +
    '<div class="cols c-2">' +
      card('instant', 'Instant meeting', 'Something has happened and you need people in a room now. The coordinator does everything in one pass and launches it.', [
        ['Fill the details and add agenda points', 'Meeting Coordinator'],
        ['Pick invitees', 'Meeting Coordinator'],
        ['Launch and notify immediately', 'Meeting Coordinator'],
        ['Attendance, minutes, actions', 'after the meeting']
      ], canI) +
      card('scheduled', 'Scheduled meeting', 'A planned review. The agenda is circulated so invitees can add their own points before the coordinator confirms it.', [
        ['Plan the meeting', 'Meeting Coordinator'],
        ['Draft the agenda, pull forward open items', 'Meeting Coordinator'],
        ['Add invitees', 'Meeting Coordinator'],
        ['Invitees add their points, then it is confirmed', 'invitees, then the coordinator']
      ], canS) +
    '</div></div>' +
    '<div class="m-ft"><button class="btn ghost" data-act="close-modal">Cancel</button></div>', true);
}

function startDraft(kind) {
  var mine = myProjects();
  STATE.draft = {
    kind: kind, step: 1, title: '', cat: kind === 'instant' ? 'Technical / Coordination' : 'Weekly Progress Review',
    prj: [mine[0] || 'P1'], date: kind === 'instant' ? TODAY : '2026-09-24', start: kind === 'instant' ? '16:30' : '11:00',
    end: kind === 'instant' ? '17:15' : '12:30', venue: kind === 'instant' ? 'Video conference' : 'Conference Hall, UCF Head Office',
    link: '', chair: STATE.user.id, agenda: [], invitees: [STATE.user.id], carried: [],
    freeze: '2026-09-23 11:00', launched: false, confirmed: false
  };
  closeModal();
  go(kind === 'instant' ? 'instant' : 'schedule');
}
