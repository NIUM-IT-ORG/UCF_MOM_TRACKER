/* ==================== MoM register: generation, approval, circulation ==================== */
var MOM_TABS = [
  ['all', 'All'], ['none', 'Not generated'], ['draft', 'Draft'], ['submitted', 'Awaiting approval'],
  ['returned', 'Returned'], ['approved', 'Approved'], ['signed', 'Signed &amp; circulated']
];

function viewMomRegister() {
  var all = heldMeetings();
  var tab = STATE.momTab || 'all';
  var list = tab === 'all' ? all : all.filter(function (m) { return m.momState === tab; });

  var counts = {};
  MOM_TABS.forEach(function (t) {
    counts[t[0]] = t[0] === 'all' ? all.length : all.filter(function (m) { return m.momState === t[0]; }).length;
  });

  var tabs = '<div class="tabs">' + MOM_TABS.map(function (t) {
    return '<button class="t' + (tab === t[0] ? ' on' : '') + '" data-act="mom-tab" data-tab="' + t[0] + '">' + t[1] +
      '<span class="cnt">' + counts[t[0]] + '</span></button>';
  }).join('') + '</div>';

  if (!list.length) {
    return momHead(all) + tabs + '<div class="card"><div class="empty">No MoM in this state.</div></div>';
  }
  if (!STATE.momMid || list.indexOf(mtg(STATE.momMid)) < 0) STATE.momMid = list[0].id;
  var m = mtg(STATE.momMid);

  var rows = list.map(function (x) {
    var acts = meetingItems(x.id).filter(function (i) { return i.type === 'action'; }).length;
    return '<tr class="clickable' + (x.id === m.id ? ' sel' : '') + '" data-act="pick-mom" data-id="' + x.id + '">' +
      '<td><div class="flex" style="gap:8px"><span class="mcode">' + mcode(x) + '</span>' +
        '<span class="tpill ' + (x.type === 'instant' ? 'instant">Instant' : 'sched">Scheduled') + '</span></div>' +
        '<b style="font-size:12.5px;color:var(--navy);display:block;margin:4px 0 3px;line-height:1.35">' + esc(x.title) + '</b>' +
        '<div class="muted" style="font-size:11px">' + fmt(x.date) + ' · ' + acts + ' action' + (acts === 1 ? '' : 's') + ' · ' + esc(u(x.chair).name) + '</div></td>' +
      '<td>' + momChip(x.momState) + '<div style="margin-top:5px"><span class="lnk">' + momCta(x.momState) + '</span></div></td></tr>';
  }).join('');

  return momHead(all) + tabs +
    '<div class="cols" style="grid-template-columns:430px 1fr;align-items:start">' +
      '<div class="card"><table>' +
        '<thead><tr><th>Meeting</th><th style="width:126px">State</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' +
      '<div class="stack" style="gap:16px">' + momPanel(m) + '</div>' +
    '</div>' +
    guide('One place for the whole MoM life', [
      'Generation, preview, the approval console, the signed upload and the circulation log are all states of the same document, so they live on one screen. The tabs above are that document’s states — <b>Awaiting approval</b> is the approver’s queue.',
      'Everything here is also reachable from inside a meeting, on its <b>Signed MoM</b> tab. Same data, two ways in: by meeting when you are working on one, by state when you are clearing a queue.'
    ]);
}

function momHead(all) {
  var waiting = all.filter(function (m) { return m.momState === 'submitted'; }).length;
  return '<div class="page-head"><div><div class="eyebrow">Meetings</div><h2>MoM register</h2>' +
    '<p>Every minutes document and the state it is in: generated, submitted, approved, signed, circulated. ' +
    (waiting ? '<b>' + waiting + '</b> waiting for approval right now.' : 'Nothing is waiting for approval.') + '</p></div>' +
    '<div class="actions"><button class="btn ghost">Export register</button></div></div>';
}
function momCta(s) {
  return { none: 'Generate →', draft: 'Preview →', submitted: 'Review →', returned: 'Fix →', approved: 'Upload signed →', signed: 'Circulation →' }[s] || 'Open →';
}

function momPanel(m) {
  var st = m.momState;
  var mayApprove = can('approve_mom'), mayUpload = can('upload_signed'), mayRecord = can('record_minutes');
  var head = '<div class="card"><div class="hd"><h3>' + esc(mcodeText(m)) + '</h3>' +
    '<span class="tag">' + esc(m.title) + '</span>' +
    '<span style="margin-left:12px" class="flex">' + shareBtn('mom', m.id, 'Share MoM') +
    '<button class="btn sm ghost" data-act="open-meeting" data-id="' + m.id + '" data-tab="mom">Open the meeting</button></span></div>' +
    '<div class="bd">' + momStateStrip(st) + '</div></div>';

  var action = '';
  if (st === 'none') {
    action = '<div class="card" style="border-left:4px solid var(--accent)"><div class="hd"><h3>Generation</h3></div><div class="bd">' +
      '<div class="notice amber"><span class="dot"></span><span>No document yet. Generating assembles it from the attendance, the minutes and the entries already recorded.</span></div>' +
      '<button class="btn primary" data-act="mom" data-id="' + m.id + '" data-to="draft"' + (mayRecord ? '' : ' disabled') + '>Generate the MoM</button>' +
      (mayRecord ? '' : '<div class="notice" style="margin:13px 0 0"><span class="dot"></span><span>Your designation cannot generate a MoM.</span></div>') + '</div></div>';
  } else if (st === 'draft' || st === 'returned') {
    action = '<div class="card" style="border-left:4px solid ' + (st === 'returned' ? 'var(--danger)' : 'var(--accent)') + '">' +
      '<div class="hd"><h3>' + (st === 'returned' ? 'Returned for correction' : 'Submit for approval') + '</h3></div><div class="bd">' +
      (st === 'returned' ? '<div class="notice red"><span class="dot"></span><span>Returned by the approver. Fix the minutes or the entries, then submit again — the version history keeps both copies.</span></div>' : '') +
      '<div class="stack" style="gap:9px;margin-bottom:14px">' +
      [['All invitees accounted for in attendance', Object.keys(m.attend || {}).length === m.invitees.length],
       ['Minutes recorded', !!m.minutes],
       ['Every action has at least one responsible officer', true],
       ['Every action has a due date', true]].map(function (c) {
        return '<div class="flex" style="gap:9px;font-size:12.5px"><span style="width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:' +
          (c[1] ? 'var(--ok)' : '#EDF1F6') + ';color:' + (c[1] ? '#fff' : '#98A5B4') + ';font-size:10px;font-weight:800">' + (c[1] ? '✓' : '·') + '</span>' +
          '<span style="flex:1;color:' + (c[1] ? 'var(--ink)' : 'var(--muted)') + '">' + c[0] + '</span></div>';
      }).join('') + '</div>' +
      '<div class="flex" style="gap:9px"><button class="btn primary" data-act="mom" data-id="' + m.id + '" data-to="submitted"' + (mayRecord ? '' : ' disabled') + '>Submit for approval</button>' +
      '<button class="btn ghost" data-act="go-minutes" data-id="' + m.id + '">Back to the minutes editor</button></div></div></div>';
  } else if (st === 'submitted') {
    action = '<div class="card" style="border-left:4px solid var(--warn)"><div class="hd"><h3>Approval console</h3>' +
      '<span class="tag">pending with ' + esc(USERS.filter(function (x) { return dg(x.dg).caps.indexOf('approve_mom') >= 0; })[0].name) + '</span></div><div class="bd">' +
      '<div class="field"><label>Decision remark <span class="hint">(required to return or reject)</span></label>' +
      '<textarea class="i" placeholder="Type your remark…"></textarea></div>' +
      '<div class="flex" style="gap:9px">' +
      '<button class="btn good" data-act="mom" data-id="' + m.id + '" data-to="approved"' + (mayApprove ? '' : ' disabled') + '>✓ Approve</button>' +
      '<button class="btn ghost" data-act="mom" data-id="' + m.id + '" data-to="returned"' + (mayApprove ? '' : ' disabled') + '>↩ Return for correction</button>' +
      '<button class="btn danger" data-act="mom" data-id="' + m.id + '" data-to="draft"' + (mayApprove ? '' : ' disabled') + '>✕ Reject</button></div>' +
      (mayApprove ? '' : '<div class="notice" style="margin:13px 0 0"><span class="dot"></span><span>Only the <b>Mission Director</b> or <b>Addl. Mission Director</b> can decide here. Switch role in the top bar to try it.</span></div>') +
      '</div></div>';
  } else if (st === 'approved') {
    action = '<div class="card" style="border-left:4px solid var(--ok)"><div class="hd"><h3>Signature &amp; upload</h3></div><div class="bd">' +
      '<div class="notice green"><span class="dot"></span><span>Approved. Print, obtain the chairperson’s signature, scan and upload. The page count and action table of the scan are checked against the approved draft before it will circulate.</span></div>' +
      '<div class="drop">' + ic('up', 26) + '<b>Upload the signed MoM</b><small>PDF only · up to 20 MB</small></div>' +
      '<button class="btn primary" style="width:100%;justify-content:center;margin-top:13px" data-act="mom" data-id="' + m.id + '" data-to="signed"' + (mayUpload ? '' : ' disabled') + '>Upload &amp; circulate</button></div></div>';
  } else {
    action = '<div class="card"><div class="hd"><h3>Signed copy</h3><span class="tag">' + fmt(m.signed.date) + '</span></div><div class="bd">' +
        '<div class="filerow" style="border-color:#BEE3CF;background:#F5FBF7"><span class="ic">PDF</span>' +
        '<div style="flex:1"><b style="font-size:12.5px;color:var(--navy);display:block">' + esc(m.signed.file) + '</b>' +
        '<small class="muted" style="font-size:11px">' + esc(m.signed.size) + ' · ' + m.signed.pages + ' pages · uploaded by ' + esc(m.signed.by) + '</small></div>' +
        '<button class="btn sm ghost">View</button></div>' +
        '<div class="notice green" style="margin:13px 0 0"><span class="dot"></span><span>Circulating the signed MoM is what <b>activates its action items</b> in the register. A circulated MoM is immutable — a correction is a linked corrigendum.</span></div>' +
      '</div></div>' +
      '<div class="card"><div class="hd"><h3>Circulation log</h3><span class="tag">' + m.signed.dispatch.length + ' recipients</span></div>' +
        '<table><thead><tr><th>Recipient</th><th style="width:132px">Channel</th><th style="width:150px">Delivery</th><th style="width:74px">Opened</th></tr></thead><tbody>' +
        m.signed.dispatch.map(function (r) {
          var bad = /Failed/.test(r[2]);
          return '<tr><td class="strong">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td>' +
            '<td><span class="chip ' + (bad ? 's-delay' : 's-done') + '">' + esc(r[2]) + '</span></td><td>' + esc(r[3]) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
  }

  var preview = st === 'none' ? '' : momPaper(m);

  var hist = m.momHistory ? '<div class="card"><div class="hd"><h3>Approval history</h3></div><div class="bd"><div class="tl">' +
    m.momHistory.map(function (h) {
      return '<div class="e"><div class="rail"><div class="bub ' + h[0] + '">' + (h[0] === 'ok' ? TICK : h[0] === 'now' ? '●' : '') + '</div><div class="stem"></div></div>' +
        '<div class="body"><b>' + esc(h[1]) + '</b><div class="who">' + esc(h[2]) + '</div></div></div>';
    }).join('') + '</div></div></div>' : '';

  return head + action + preview + hist;
}

function momStateStrip(st) {
  var steps = [['none', 'Not generated'], ['draft', 'Draft'], ['submitted', 'Awaiting approval'], ['approved', 'Approved'], ['signed', 'Signed & circulated']];
  var order = ['none', 'draft', 'submitted', 'approved', 'signed'];
  var cur = order.indexOf(st === 'returned' ? 'draft' : st);
  return '<div class="stepper" style="margin:0">' + steps.map(function (s, i) {
    var cls = i < cur ? 'done' : (i === cur ? 'now' : '');
    return '<div class="stp ' + cls + '"><span class="n">' + (i < cur ? '✓' : i + 1) + '</span><div class="t">' + s[1] + '</div></div>';
  }).join('') + '</div>' +
  (st === 'returned' ? '<div class="notice red" style="margin:13px 0 0"><span class="dot"></span><span>This MoM was <b>returned</b> and is back with the coordinator.</span></div>' : '');
}

function shareContext(kind, id) {

      kind: kind, id: id,
      what: kind === 'mom' ? 'Minutes of Meeting' : (kind === 'agenda' ? 'Agenda' : 'Meeting details'),
      subject: (kind === 'mom' ? 'Minutes of Meeting — ' : kind === 'agenda' ? 'Agenda — ' : 'Meeting — ') + m.title,
      ref: mcodeText(m), to: m.invitees.slice(), attach: att,
      body: kind === 'mom'
        ? 'Please find the ' + (m.signed ? 'signed' : 'draft') + ' Minutes of Meeting for ' + mcodeText(m) + ' — ' + m.title +
          ', held on ' + fmt(m.date) + ' and chaired by ' + u(m.chair).name + '.\n\n' +
          meetingItems(m.id).filter(function (x) { return x.type === 'action'; }).length + ' action items and ' +
          meetingItems(m.id).filter(function (x) { return x.type === 'clarification'; }).length + ' clarifications arise from this meeting.'
        : 'You are invited to ' + m.title + ' (' + mcodeText(m) + ').\n\n' +
          'Date: ' + fmt(m.date) + '\nTime: ' + m.start + ' – ' + m.end + ' hrs\nVenue: ' + m.venue +
          (m.link ? '\nLink: ' + m.link : '') + '\nChair: ' + u(m.chair).name +
          '\n\n' + m.agenda.length + ' agenda items. Please confirm your attendance.'
    };
  }
  if (kind === 'item') {
    it = item(id); if (!it) return null;
    m = mtg(it.m);
    var to = it.type === 'action' ? (it.owners || []).concat([it.raised]) : [it.raised].concat(it.respBy ? [it.respBy] : []);
    return {
      kind: kind, id: id, what: it.type === 'action' ? 'Action item' : 'Clarification',
      subject: (it.type === 'action' ? 'Action ' : 'Clarification ') + it.id + ' — ' + mcodeText(m),
      ref: it.id, to: to.filter(function (v, i, a) { return a.indexOf(v) === i; }), attach: [],
      body: (it.type === 'action' ? 'Action ' : 'Clarification ') + it.id + ' arising from ' + mcodeText(m) + ':\n\n' +
        it.desc + '\n\n' +
        (it.type === 'action'
          ? 'Responsible: ' + it.owners.map(function (o) { return u(o).name; }).join(', ') +
            '\nDue: ' + fmt(it.due) + '\nPriority: ' + it.pri + '\nStatus: ' + it.status
          : 'Raised by: ' + u(it.raised).name + '\nResponded by: ' + (it.respBy ? u(it.respBy).name : 'not yet') + '\nStatus: ' + it.status)
    };
  }
  if (kind === 'project') {
    p = prj(id); if (!p) return null;
    return {
      kind: kind, id: id, what: 'Project documents',
      subject: 'Project documents — ' + p.name, ref: p.id,
      to: p.officers.map(function (o) { return o[0]; }),
      attach: p.docs.slice(0, 2).map(function (dc) { return dc.file; }),
      body: 'Sharing the current document set for ' + p.name + ' — ' + p.full + '.\n\n' +
        p.docs.length + ' documents are on record. Select below which of them to attach.'
    };
  }
  /* report / register */
  return {
    kind: 'report', id: id, what: 'Report',
    subject: 'UCF — ' + (id || 'Action Taken Report'), ref: id || 'ATR',
    to: ['u1', 'u2', 'u3'], attach: [(id || 'Action-Taken-Report') + '.pdf'],
    body: 'Attached is the ' + (id || 'Action Taken Report') + ' for the Urban Challenge Fund as on ' + fmt(TODAY) + '.'
  };
}

function shareSend() {
  var s = STATE.share, c = s.ctx;
  if (!s.to.length) { toast('Pick at least one recipient', 'bad'); return; }
  if (!s.email && !s.wa && !s.app) { toast('Pick at least one channel', 'bad'); return; }
  var chans = [];
  if (s.email) chans.push('Email');
  if (s.wa) chans.push('WhatsApp');
  if (s.app) chans.push('in-app');
  COMMS.unshift([fmt(TODAY) + ' now', 'MANUAL', 'Shared ' + c.what.toLowerCase(), c.ref, s.to.length,
    chans.join(' + '), 'Queued ' + s.to.length, STATE.user.name]);
  closeModal();
  toast('Sent to ' + s.to.length + ' recipient' + (s.to.length === 1 ? '' : 's') + ' on ' + chans.join(' + '), 'ok');
  render();
}

/* ==================== How it works ==================== */
function viewHelp() {
  function flow(title, steps, tone) {
    return '<div class="card"><div class="hd"><h3>' + title + '</h3><span class="tag">' + tone + '</span></div><div class="bd"><div class="tl">' +
      steps.map(function (s, i) {
        return '<div class="e"><div class="rail"><div class="bub ' + (i === 0 ? 'now' : 'wait') + '">' + (i + 1) + '</div><div class="stem"></div></div>' +
          '<div class="body"><b>' + s[0] + '</b><div class="who">' + s[1] + '</div></div></div>';
      }).join('') + '</div></div></div>';
  }
  return '<div class="page-head"><div><div class="eyebrow">Guide</div><h2>How this tracker works</h2>' +
      '<p>The whole idea in one line: <b>after every meeting, each commitment is written down with named officers and a date, and tracked until a senior officer agrees it is done.</b></p></div></div>' +
    '<div class="cols c-2" style="margin-bottom:16px">' +
      flow('Instant meeting', [
        ['Coordinator fills the details and any agenda points', 'Meeting Coordinator or PDMC'],
        ['Picks invitees and launches', 'notifications go out immediately'],
        ['Meeting happens', 'everyone'],
        ['Attendance, minutes, actions and clarifications', 'Meeting Coordinator'],
        ['MoM generated, approved, signed, circulated', 'Coordinator → MD/AMD → Coordinator']
      ], 'no circulation window') +
      flow('Scheduled meeting', [
        ['Coordinator plans the meeting', 'Meeting Coordinator or PDMC'],
        ['Drafts the agenda and pulls forward open items', 'Meeting Coordinator'],
        ['Adds invitees', 'Meeting Coordinator'],
        ['Invitees add their own points until the freeze', 'invitees'],
        ['Coordinator confirms and everyone is notified', 'Meeting Coordinator'],
        ['Attendance, minutes, actions and clarifications', 'Meeting Coordinator'],
        ['MoM generated, approved, signed, circulated', 'Coordinator → MD/AMD → Coordinator']
      ], 'agenda circulated first') +
    '</div>' +
    '<div class="cols c-2">' +
      '<div class="card"><div class="hd"><h3>Life of an action</h3></div><div class="bd">' +
        '<div class="flex" style="gap:9px;margin-bottom:12px">' + statusChip('In Progress') + '<span class="muted">→ a responsible officer reports it done →</span>' +
        statusChip('Under Review') + '<span class="muted">→ a senior officer confirms →</span>' + statusChip('Completed') + '</div>' +
        '<div class="flex" style="gap:9px;margin-bottom:12px">' + statusChip('Delayed') + '<span class="muted">set automatically the night a deadline passes</span></div>' +
        '<p class="muted" style="font-size:12.5px;margin:0">Under Review exists so nobody signs off their own work. Where an action has several responsible officers, <b>all of them are equally accountable</b> and any one of them may report it complete.</p>' +
      '</div></div>' +
      '<div class="card"><div class="hd"><h3>Life of a clarification</h3></div><div class="bd">' +
        '<div class="flex" style="gap:9px;margin-bottom:12px">' + statusChip('Open') + '<span class="muted">→ someone answers →</span>' +
        statusChip('Responded') + '<span class="muted">→ the raiser accepts →</span>' + statusChip('Closed') + '</div>' +
        '<p class="muted" style="font-size:12.5px;margin:0">A clarification is a question, not a task, so it has no due date and no owner — only a person who responded. It still carries forward into the next meeting until it is closed.</p>' +
      '</div></div>' +
    '</div>' +
    guide('Try this in two minutes', [
      '1. Sign in as <b>Officer D</b> (Meeting Coordinator) → Meetings → <b>+ New meeting</b> → pick <b>Scheduled</b> → walk the four steps, and use <b>Add from previous meetings</b> on step 2.<br>' +
      '2. Open <b>UCF/P1/RM-04</b> → the <b>Actions / Clarifications</b> tab → <b>+ Add entry</b> → switch the type dropdown between Action and Clarification and watch the form change.<br>' +
      '3. Switch to <b>Officer H</b> (ULB Nodal Officer) in the top bar — the navigation shrinks, the register narrows to Project 1, and most buttons disappear.<br>' +
      '4. Switch to <b>Officer A</b> (Mission Director) → open ACT-02 from the register → confirm it as completed.'
    ]);
}

function crumb() {
  if (STATE.route === 'meeting') {
    var m = mtg(STATE.mid);
    return '<button class="lnk" data-act="go" data-to="meetings">Meetings</button> › <b>' + esc(m ? mcodeText(m) : '') + '</b>';
  }
  if (STATE.route === 'projects' && STATE.pid) {
    return '<button class="lnk" data-act="open-project" data-id="">Project master</button> › <b>' + esc(prj(STATE.pid).name) + '</b>';
  }
  return '<b>' + esc(TITLES[STATE.route] || '') + '</b>';
}

function navHtml() {
  return NAV.map(function (n) {
    if (n.grp) return '<div class="group">' + n.grp + '</div>';
    var locked = n.cap && !can(n.cap);
    var pill = n.pill ? '<span class="pill ' + (n.g ? 'g' : '') + '">' + n.pill() + '</span>' : '';
    return '<a class="' + (STATE.route === n.r ? 'active' : '') + (locked ? ' locked' : '') + '"' +
      (locked ? '' : ' data-act="go" data-to="' + n.r + '"') + '>' + ic(n.ic) + '<span>' + n.l + '</span>' + pill + '</a>';
  }).join('');
}

function viewLogin() {
  var cards = LOGIN_ROLES.map(function (id) {
    var x = u(id), dd = dg(x.dg);

      dd.caps.length + ' of ' + CAPS.length + ' capabilities</small>' +

    '<div style="text-align:center;color:#fff;margin-bottom:26px">' +

      '<h1 style="font-family:var(--serif);font-size:27px;margin:0 0 6px;font-weight:700">UCF Meeting &amp; Action Item Tracker</h1>' +
      '<p style="margin:0 auto;color:#B9CBE4;font-size:13.5px;max-width:680px">Plan a meeting in advance or call one instantly, record what was decided, and track every action and clarification until a senior officer agrees it is done.</p></div>' +
    '<div class="rolegrid">' + cards + '</div>' +

/* ============================ render ============================ */

  var app = $('app');

  var fid = document.activeElement && document.activeElement.id;
  var caret = null;
  try { if (fid && document.activeElement.selectionStart != null) caret = document.activeElement.selectionStart; } catch (e) {}

  var view = {
    dashboard: viewDashboard, meetings: viewMeetings, instant: viewInstant, schedule: viewSchedule,
    meeting: viewMeeting, minutes: viewMinutes, mom: viewMomRegister,
    register: viewRegister, projects: viewProjects, people: viewPeople,
    access: viewAccess, audit: viewAudit, comms: viewComms, reports: viewReports, help: viewHelp
  }[STATE.route] || viewDashboard;

  app.innerHTML =
    '<div class="app">' +
      '<aside class="sidebar">' +
        '<div class="brand"><div class="mark" style="color:#fff">' + ic('seal', 20) + '</div>' +
        '<div><h1>UCF Tracker</h1><span>Urban Challenge Fund<br>Minutes &amp; Action Items</span></div></div>' +
        '<nav class="nav">' + navHtml() + '</nav>' +
        '<div class="foot">Interactive wireframe · dummy data<br><b>Not a live system</b></div>' +
      '</aside>' +
      '<div class="main">' +
        '<div class="topbar"><div class="crumb">' + crumb() + '</div>' +
          '<div class="rolebox"><span class="lbl">Signed in as</span>' +
            '<select class="i" id="roleSel" style="min-height:34px;max-width:230px">' +
              USERS.filter(function (x) { return x.login; }).map(function (x) {
                return '<option value="' + x.id + '"' + (x.id === STATE.user.id ? ' selected' : '') + '>' + esc(x.name) + ' · ' + esc(dg(x.dg).name) + '</option>';
              }).join('') + '</select>' +
            '<div class="chip-user"><div class="av" style="background:' + STATE.user.c + '">' + esc(STATE.user.av) + '</div>' +
            '<div class="who"><b>' + esc(STATE.user.name) + '</b><small>' + esc(dg(STATE.user.dg).name) + '</small></div></div>' +
            '<button class="btn ghost sm" data-act="logout">Sign out</button>' +
          '</div></div>' +
        '<div class="stage" id="stage"><div class="content">' + view() + '</div></div>' +
      '</div>' +
    '</div>';

  if (fid) {
    var el = $(fid);
    if (el) { el.focus(); try { if (caret != null && el.setSelectionRange) el.setSelectionRange(caret, caret); } catch (e2) {} }
  }
}

function go(route) {
  STATE.route = route;
  closeDrawer();
  render();
  var st = $('stage'); if (st) st.scrollTop = 0;
}

/* ============================ meetings from a draft ============================ */
function makeMeetingFromDraft(stage) {
  var dr = STATE.draft;
  var scope = dr.prj.length === 1 ? dr.prj[0] : 'HO';
  var pre = dr.kind === 'instant' ? 'IM' : 'RM';
  var n = MEETINGS.filter(function (m) { return m.code[2].indexOf(pre) === 0; }).length + 1;
  var rec = {
    id: 'N' + Date.now(), code: ['UCF', scope, pre + '-' + String(n).padStart(2, '0')], type: dr.kind,
    title: dr.title || 'Untitled meeting', cat: dr.cat, date: dr.date, start: dr.start, end: dr.end,
    venue: dr.venue, link: dr.link, chair: dr.chair, by: STATE.user.id, prj: dr.prj.slice(),
    stage: stage, momState: 'none', freeze: dr.freeze, confirmedBy: STATE.user.id, confirmedOn: TODAY,
    agenda: (dr.carried.length ? [{ t: 'Review of previous items (' + dr.carried.length + ' open)', p: dr.prj[0], by: 'system', att: 0, carry: true }] : [])
      .concat(dr.agenda.map(function (a) { return { t: a.t, p: a.p, by: a.by, att: 0 }; })),
    invitees: dr.invitees.slice(), attend: {}, minutes: '', docs: []
  };
  MEETINGS.push(rec);
  return rec;
}

/* ============================ events ============================ */
document.addEventListener('click', function (ev) {
  var t = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!t) return;
  var a = t.getAttribute('data-act');
  var id = t.getAttribute('data-id');

  switch (a) {
    case 'login':
      STATE.user = u(id); STATE.route = 'dashboard'; render();
      toast('Signed in as ' + STATE.user.name + ' · ' + dg(STATE.user.dg).name, 'ok'); return;
    case 'logout': STATE.user = null; STATE.route = 'login'; render(); return;
    case 'go': go(t.getAttribute('data-to')); return;
    case 'close-modal': closeModal(); return;
    case 'close-drawer': closeDrawer(); STATE.iid = null; render(); return;

    case 'open-meeting':
      STATE.mid = id; STATE.mtab = t.getAttribute('data-tab') || 'agenda'; go('meeting'); return;
    case 'mtab': STATE.mtab = t.getAttribute('data-tab'); render(); return;
    case 'pick-minutes': STATE.minMid = id; render(); return;
    case 'pick-mom': STATE.momMid = id; render(); return;
    case 'mom-tab': STATE.momTab = t.getAttribute('data-tab'); STATE.momMid = null; render(); return;
    case 'go-mom': STATE.momMid = id; STATE.momTab = 'all'; go('mom'); return;
    case 'go-minutes': STATE.minMid = id; go('minutes'); return;
    case 'new-item-for': STATE.mid = id; newItemForm(t.getAttribute('data-type'), id); return;

    case 'open-project':
      STATE.pid = id || null; STATE.ptab = 'info'; go('projects'); return;
    case 'ptab': STATE.ptab = t.getAttribute('data-tab'); render(); return;

    case 'open-item': STATE.iid = id; itemDrawer(id); render(); itemDrawer(id); return;
    case 'edit-item': newItemForm(null, null, id); return;
    case 'new-item': newItemForm(t.getAttribute('data-type'), STATE.mid); return;
    case 'save-item': saveItem(t.getAttribute('data-again')); return;
    case 'f-owner': {
      var f = STATE.form, ix = f.owners.indexOf(id);
      if (ix >= 0) f.owners.splice(ix, 1); else f.owners.push(id);
      if (STATE.formErr) STATE.formErr.owners = 0;
      renderItemForm(); return;
    }
    case 'item-status': {
      var it = item(id), v = t.getAttribute('data-v');
      it.status = v;
      it.hist.push([TODAY + ' now', 'Status changed to ' + v, STATE.user.name]);
      toast(id + ' is now ' + v, 'ok');
      closeDrawer(); render(); return;
    }

    case 'new-meeting': chooseMeetingType(); return;
    case 'start-meeting': startDraft(t.getAttribute('data-kind')); return;
    case 'toggle-prj': {
      var dr = STATE.draft, i2 = dr.prj.indexOf(id);
      if (i2 >= 0) { if (dr.prj.length > 1) dr.prj.splice(i2, 1); } else dr.prj.push(id);
      render(); return;
    }
    case 'add-agenda': {
      var txt = $('agText') ? $('agText').value.trim() : '';
      if (!txt) { toast('Type the agenda point first', 'bad'); return; }
      STATE.draft.agenda.push({ t: txt, p: $('agPrj').value || null, by: STATE.user.id });
      render(); toast('Agenda point added', 'ok'); return;
    }
    case 'del-agenda': STATE.draft.agenda.splice(+t.getAttribute('data-i'), 1); render(); return;
    case 'carry-picker': carryPicker(); return;
    case 'toggle-carry': {
      var c = STATE.draft.carried, ci = c.indexOf(id);
      if (ci >= 0) c.splice(ci, 1); else c.push(id);
      carryPicker(); return;
    }
    case 'uncarry': {
      var cc = STATE.draft.carried, k = cc.indexOf(id);
      if (k >= 0) cc.splice(k, 1); render(); return;
    }
    case 'toggle-invitee': {
      var iv = STATE.draft.invitees, j = iv.indexOf(id);
      if (j >= 0) { if (id !== STATE.user.id) iv.splice(j, 1); } else iv.push(id);
      render(); return;
    }
    case 'sched-step': {
      var n2 = +t.getAttribute('data-n');
      if (n2 > 1 && !STATE.draft.title.trim()) { toast('Give the meeting a title first', 'bad'); var ti = $('dTitle'); if (ti) { ti.classList.add('bad'); ti.focus(); } return; }
      STATE.draft.step = n2; render(); return;
    }
    case 'sched-confirm': {
      if (!STATE.draft.title.trim()) { toast('Give the meeting a title first', 'bad'); return; }
      var rec = makeMeetingFromDraft(5);
      STATE.draft = null; STATE.mid = rec.id; STATE.mtab = 'agenda';
      toast('Confirmed. ' + mcodeText(rec) + ' issued and ' + rec.invitees.length + ' invitees notified.', 'ok');
      go('meeting'); return;
    }
    case 'confirm-existing': {
      var mm = mtg(id); mm.stage = 5; mm.confirmedBy = STATE.user.id; mm.confirmedOn = TODAY;
      toast('Meeting confirmed and circulated to ' + mm.invitees.length + ' invitees', 'ok'); render(); return;
    }
    case 'instant-launch': {
      if (!STATE.draft.title.trim()) { toast('Give the meeting a title first', 'bad'); var ti2 = $('dTitle'); if (ti2) { ti2.classList.add('bad'); ti2.focus(); } return; }
      var rec2 = makeMeetingFromDraft(2);
      STATE.draft.launched = true; STATE.draft.mid = rec2.id;
      toast('Launched. ' + mcodeText(rec2) + ' issued and everyone notified.', 'ok'); render(); return;
    }
    case 'instant-end': {
      var mid = STATE.draft.mid; var mrec = mtg(mid); mrec.stage = 6;
      STATE.draft = null; STATE.mid = mid; STATE.mtab = 'attend';
      toast('Meeting ended — mark attendance, then record the minutes', 'ok'); go('meeting'); return;
    }

    case 'attend': {
      var m3 = mtg(STATE.mid); m3.attend = m3.attend || {};
      m3.attend[id] = t.getAttribute('data-v');
      if (m3.stage < 6) m3.stage = 6;
      render(); return;
    }
    case 'attend-all': {
      var m4 = mtg(STATE.mid); m4.attend = m4.attend || {};
      m4.invitees.forEach(function (x) { m4.attend[x] = 'P'; });
      if (m4.stage < 6) m4.stage = 6;
      toast('Everyone marked present', 'ok'); render(); return;
    }
    case 'rte': {
      var cmd = t.getAttribute('data-cmd'), val = t.getAttribute('data-val');
      document.execCommand(cmd, false, val || null);
      var box = $('rteBox'); if (box) box.focus(); return;
    }
    case 'save-minutes': {
      var m5 = mtg(id || STATE.mid), b = $('rteBox');
      if (b) m5.minutes = b.innerHTML;
      if (m5.stage < 7) m5.stage = 7;
      toast('Draft minutes saved', 'ok'); return;
    }
    case 'mom': {
      var m6 = mtg(id || STATE.mid), to = t.getAttribute('data-to');
      m6.momState = to;
      if (to === 'signed') {
        m6.signed = m6.signed || { file: 'MoM_' + m6.code.join('-') + '_signed.pdf', size: '1.4 MB', by: STATE.user.name, date: TODAY, pages: 5,
          dispatch: m6.invitees.map(function (x) { return [u(x).name, u(x).login ? 'Email + WhatsApp' : 'Email', 'Delivered', 'No']; }) };
        m6.stage = 8;
      }
      toast('MoM ' + ({ draft: 'generated', submitted: 'submitted for approval', approved: 'approved', returned: 'returned for correction', signed: 'signed and circulated' })[to], 'ok');
      render(); return;
    }

    case 'print-mom': {
      var pm = mtg(id || STATE.mid || STATE.momMid);
      if (!pm) return;
      $('printArea').innerHTML = momSheet(pm);
      toast('Opening the print dialog — choose “Save as PDF” as the destination', 'ok');
      setTimeout(function () { window.print(); }, 120);
      return;
    }
    case 'share': openShare(t.getAttribute('data-kind'), id); return;
    case 'share-chan': { var k = t.getAttribute('data-k'); STATE.share[k] = !STATE.share[k]; renderShare(); return; }
    case 'share-to': {
      var sl = STATE.share.to, si = sl.indexOf(id);
      if (si >= 0) sl.splice(si, 1); else sl.push(id);
      renderShare(); return;
    }
    case 'share-send': shareSend(); return;
    case 'share-copy': toast('Link copied to the clipboard', 'ok'); return;
    case 'comm-tab': STATE.commTab = t.getAttribute('data-tab'); render(); return;
    case 'add-doc': docForm(t.getAttribute('data-scope'), id); return;
    case 'pick-file': {
      var names = ['sanction-order.pdf', 'progress-note.pdf', 'site-photos.pdf', 'agreement-copy.pdf', 'working-sheet.xlsx'];
      STATE.doc.file = names[Math.floor(Math.random() * names.length)];
      if (STATE.docErr) STATE.docErr.file = 0;
      renderDocForm(); return;
    }
    case 'save-doc': saveDoc(); return;

    case 'filter-reg': {
      STATE.rf = { type: t.getAttribute('data-type') || '', status: t.getAttribute('data-status') || '',
        prj: t.getAttribute('data-prj') || '', owner: '', q: '', mine: false };
      STATE.pid = null; go('register'); return;
    }
    case 'rf-mine': STATE.rf.mine = !STATE.rf.mine; render(); return;
    case 'who-can': whoCan(id); return;
    case 'cal': {
      var dir = +t.getAttribute('data-dir');
      if (dir === 0) STATE.calMonth = TODAY.slice(0, 7);
      else {
        var pm = STATE.calMonth.split('-'), yy = +pm[0], mm2 = +pm[1] - 1 + dir;
        if (mm2 < 0) { mm2 = 11; yy--; } if (mm2 > 11) { mm2 = 0; yy++; }
        STATE.calMonth = yy + '-' + String(mm2 + 1).padStart(2, '0');
      }
      render(); return;
    }
  }
});

/* text + select bindings */
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.id === 'roleSel') return;
  if (el.hasAttribute('data-bind')) { STATE.draft[el.getAttribute('data-bind')] = el.value; el.classList.remove('bad'); return; }
  if (el.hasAttribute('data-f')) {
    var k = el.getAttribute('data-f');
    STATE.form[k] = el.value; el.classList.remove('bad');
    if (k === 'type') { STATE.form.status = el.value === 'clarification' ? 'Open' : 'In Progress'; STATE.formErr = {}; renderItemForm(); }
    return;
  }
  if (el.hasAttribute('data-d')) { STATE.doc[el.getAttribute('data-d')] = el.value; el.classList.remove('bad'); return; }
  if (el.hasAttribute('data-mf')) { STATE.mf[el.getAttribute('data-mf')] = el.value; render(); return; }
  if (el.hasAttribute('data-rf')) { STATE.rf[el.getAttribute('data-rf')] = el.value; render(); return; }
  if (el.hasAttribute('data-uf')) { STATE.uf[el.getAttribute('data-uf')] = el.value; render(); return; }
  if (el.hasAttribute('data-df')) { STATE.dfType = el.value; render(); return; }
  if (el.hasAttribute('data-sh')) { STATE.share[el.getAttribute('data-sh')] = el.value; return; }
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.id === 'roleSel') {
    STATE.user = u(el.value);
    STATE.pid = null; STATE.iid = null;
    STATE.rf = { type: '', status: '', prj: '', owner: '', q: '', mine: false };
    STATE.mf = { type: '', cat: '', prj: '', q: '' };
    closeDrawer();
    if (STATE.route === 'access' && !can('manage_access')) STATE.route = 'dashboard';
    toast('Now signed in as ' + STATE.user.name + ' · ' + dg(STATE.user.dg).name, 'ok');
    render(); return;
  }
  if (el.tagName === 'SELECT' && (el.hasAttribute('data-f') || el.hasAttribute('data-bind') || el.hasAttribute('data-d'))) {
    /* handled by the input listener; selects fire both */
  }
});

/* close overlays */
document.addEventListener('click', function (ev) { if (ev.target && ev.target.id === 'mask') closeModal(); });
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') { closeModal(); closeDrawer(); }
});

render();

</script>
