# UCF Meeting & Action Item Tracker — nginx site.
#
# Two upstreams, not one. Next.js can proxy /api/v1 itself, and does in
# development, but routing it here means an uploaded 25 MB sanction order makes
# one hop instead of two and is not buffered twice.
#
# certbot --nginx rewrites the listen lines and adds the redirect when the
# certificate is issued. Everything below survives that edit.

upstream mom_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

upstream mom_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# An officer refreshing a report should not be able to hammer the box, but a
# review meeting where fifteen people load the dashboard at once is normal.
#
# Both zones key on the client IP, and a government office is behind one NAT
# address — so these are sized for "a floor of officers arriving at 9am", not
# for one person. The application's own account lockout is the real defence
# against password guessing; this only stops it arriving at volume.
limit_req_zone $binary_remote_addr zone=mom_api_rl:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mom_login_rl:10m rate=30r/m;

# 429, not nginx's default 503. A refused sign-in is the client's doing, and
# the web app shows "something went wrong on our side" for a 5xx — which would
# send an officer who typed their password twice to the IT helpdesk.
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    # Certbot's HTTP-01 challenge. Everything else goes to HTTPS once the
    # certificate exists; until then this server block serves the app directly.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 30m;   # the app caps uploads at 25 MB; leave headroom
    client_body_timeout 120s;

    # Do not advertise the version to anyone scanning.
    server_tokens off;

    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Signing in is the one route worth rate-limiting hard: the application
    # locks an account after repeated failures, and this stops the attempt
    # reaching it at volume in the first place.
    location = /api/v1/auth/login {
        limit_req zone=mom_login_rl burst=15 nodelay;
        proxy_pass http://mom_api;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/v1/ {
        limit_req zone=mom_api_rl burst=40 nodelay;
        proxy_pass http://mom_api;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Generating a MoM renders a whole document; a report over a year of
        # meetings is not instant either. 60s is the application's own ceiling.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # An upload is one PUT of raw bytes. Streaming it through rather than
        # spooling it to disk first is both faster and quieter on the volume.
        proxy_request_buffering off;
    }

    # Next.js fingerprints these filenames, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://mom_web;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://mom_web;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/csv application/xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/mom.access.log;
    error_log  /var/log/nginx/mom.error.log;
}
